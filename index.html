<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Dynasty — Draft Class Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#0b1220; --panel:#121b2e; --panel2:#18233a; --line:#24314d; --text:#e8edf7; --muted:#8f9bb5;
  --accent:#f5b83d; --accent2:#3d8bf5; --good:#3ecf8e; --bad:#f2647a; --mid:#c9d3e6;
  --afc:#e5484d; --nfc:#3d8bf5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:Oswald,Inter,sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
a{color:var(--accent2)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .ball{width:30px;height:30px}
.brand h1{font-size:20px;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:11px;font-family:Inter;letter-spacing:0;font-weight:500;text-transform:none}
.yearpill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:Oswald,Inter,sans-serif;font-size:15px}
.yearpill b{color:var(--accent)}
.savestat{margin-left:auto;color:var(--muted);font-size:12px}
.savestat.ok{color:var(--good)}
.savestat.warn{color:var(--accent)}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs a{color:var(--muted);text-decoration:none;padding:9px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:18px;margin-bottom:10px;text-transform:uppercase}
.card h3{font-size:15px;margin:14px 0 8px;text-transform:uppercase;color:var(--mid)}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.blue{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#1b2a4a,#121b2e 60%);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero .trophy{font-size:44px}
.hero h2{font-size:28px;text-transform:uppercase}
.hero .score{font-family:Oswald,Inter,sans-serif;font-size:20px;color:var(--accent)}
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:Oswald,Inter,sans-serif;font-size:20px}
.tile .s{font-size:12px;color:var(--mid)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.nosort{cursor:default}
th.sorted{color:var(--accent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:rgba(255,255,255,.03)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.tablewrap table th{background:var(--panel2)}
.plink{color:var(--text);text-decoration:none;font-weight:600;cursor:pointer}
.plink:hover{color:var(--accent)}
.tlink{cursor:pointer;font-weight:600}
.tlink:hover{color:var(--accent)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--mid);margin-left:4px;vertical-align:1px}
.badge.gold{background:#3a2c08;border-color:#7a5a12;color:var(--accent)}
.badge.green{background:#0d3324;border-color:#1c6a4a;color:var(--good)}
.badge.red{background:#3a1119;border-color:#7a2533;color:var(--bad)}
.badge.blue{background:#0f2546;border-color:#24508f;color:#8fbaff}
.ovr{display:inline-block;min-width:30px;text-align:center;font-family:Oswald,Inter,sans-serif;font-weight:600;border-radius:5px;padding:0 4px}
.o90{background:#5a3e00;color:#ffd36b}.o80{background:#103c2a;color:#5ff0aa}.o70{background:#14304f;color:#9cc7ff}.o60{background:#2a2f3b;color:#c9d3e6}.o50{background:#3a1a22;color:#ff9aa9}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 9px;font:inherit}
textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input.mini{width:62px;padding:3px 6px}
select.mini{padding:3px 6px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-weight:600;font-size:12px}
.subtabs button.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.conf-h{font-family:Oswald,Inter,sans-serif;font-size:20px;margin:6px 0 10px}
.conf-h.afc{color:var(--afc)}.conf-h.nfc{color:var(--nfc)}
.div-t{margin-bottom:12px}
.div-t h4{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 0 4px}
.seed{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#1a1300;font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-right:4px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;overflow-x:auto}
.bracket .col h4{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.game{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.game div{display:flex;justify-content:space-between;padding:5px 9px;font-size:13px}
.game div.w{font-weight:700}
.game div.l{color:var(--muted)}
.game div+div{border-top:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:1000px;width:100%;padding:20px;position:relative}
.modal .x{position:absolute;right:12px;top:10px;background:none;border:none;color:var(--muted);font-size:22px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}
.empty{padding:30px;text-align:center;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1a1300;font-weight:700;text-align:center;line-height:24px;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.list{margin:0;padding-left:18px}
.list li{margin:3px 0}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
.warnbox{border:1px solid #7a5a12;background:#2a2008;color:#ffd78a;border-radius:8px;padding:8px 12px;font-size:13px}
.cc{display:flex;gap:5px;align-items:center;justify-content:flex-end}.cc .ct{font-size:11px;color:var(--muted);min-width:30px;text-align:right}.cc.moved .ct{color:var(--accent);font-weight:700}.cc.moved .ovr{outline:1px solid var(--accent)}
.small.ok{color:var(--good)}.small.bad{color:var(--bad)}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin-top:12px}
.dropzone.over{border-color:var(--accent);background:rgba(245,184,61,.06)}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
@media (max-width:700px){.bracket{grid-template-columns:repeat(4,200px)}.brand h1{font-size:16px}}
</style>
<script id="league-data" type="application/json">null</script>
</head>
<body>
<div id="app-shell">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <svg class="ball" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="32" rx="28" ry="17" transform="rotate(-35 32 32)" fill="#8a4b20" stroke="#5e300f" stroke-width="2"/><path d="M22 42 L42 22" stroke="#fff" stroke-width="2.5"/><path d="M27 33l4 4M30 30l4 4M33 27l4 4" stroke="#fff" stroke-width="2"/></svg>
        <div><h1>Gridiron Dynasty</h1><small>Your draft classes, simulated into the future</small></div>
      </div>
      <div class="yearpill" id="yearpill"></div>
      <div class="savestat" id="savestat"></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#home" data-tab="home">Home</a>
      <a href="#draft" data-tab="draft">Draft</a>
      <a href="#players" data-tab="players">Players &amp; Ratings</a>
      <a href="#careers" data-tab="careers">Year by Year</a>
      <a href="#stats" data-tab="stats">Season Stats</a>
      <a href="#standings" data-tab="standings">Standings</a>
      <a href="#playoffs" data-tab="playoffs">Playoffs</a>
      <a href="#history" data-tab="history">History</a>
      <a href="#reports" data-tab="reports">Reports</a>
      <a href="#file" data-tab="file">Save / Load</a>
    </nav>
  </header>
  <main id="view"></main>
  <div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script id="app-script">
(function(){
'use strict';

/* ---------- capture a pristine copy of the page before anything renders (used to save) ---------- */
var SHELL_HTML = document.getElementById('app-shell').outerHTML;
var STYLE_HTML = document.getElementById('app-style').outerHTML;
var SCRIPT_HTML = document.getElementById('app-script').outerHTML;
var HEAD_HTML = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Gridiron Dynasty — Draft Class Simulator<\/title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">';
var LS_KEY = 'gridiron-dynasty-save-v1';

/* ---------- random helpers ---------- */
function rnd(){ return Math.random(); }
function U(a,b){ return a + (b-a)*Math.random(); }
function N(mu,sd){ var u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function ri(a,b){ return Math.floor(U(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function pois(l){ if(l<=0) return 0; if(l>30) return Math.max(0,Math.round(N(l,Math.sqrt(l)))); var L=Math.exp(-l),k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }
function half(x){ return Math.max(0,Math.round(x*2)/2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }

/* ---------- league constants ---------- */
var TEAM_DEF = [
 ['BUF','Buffalo','Bills','AFC','East'],['MIA','Miami','Dolphins','AFC','East'],['NE','New England','Patriots','AFC','East'],['NYJ','New York','Jets','AFC','East'],
 ['BAL','Baltimore','Ravens','AFC','North'],['CIN','Cincinnati','Bengals','AFC','North'],['CLE','Cleveland','Browns','AFC','North'],['PIT','Pittsburgh','Steelers','AFC','North'],
 ['HOU','Houston','Texans','AFC','South'],['IND','Indianapolis','Colts','AFC','South'],['JAX','Jacksonville','Jaguars','AFC','South'],['TEN','Tennessee','Titans','AFC','South'],
 ['DEN','Denver','Broncos','AFC','West'],['KC','Kansas City','Chiefs','AFC','West'],['LV','Las Vegas','Raiders','AFC','West'],['LAC','Los Angeles','Chargers','AFC','West'],
 ['DAL','Dallas','Cowboys','NFC','East'],['NYG','New York','Giants','NFC','East'],['PHI','Philadelphia','Eagles','NFC','East'],['WAS','Washington','Commanders','NFC','East'],
 ['CHI','Chicago','Bears','NFC','North'],['DET','Detroit','Lions','NFC','North'],['GB','Green Bay','Packers','NFC','North'],['MIN','Minnesota','Vikings','NFC','North'],
 ['ATL','Atlanta','Falcons','NFC','South'],['CAR','Carolina','Panthers','NFC','South'],['NO','New Orleans','Saints','NFC','South'],['TB','Tampa Bay','Buccaneers','NFC','South'],
 ['ARI','Arizona','Cardinals','NFC','West'],['LAR','Los Angeles','Rams','NFC','West'],['SF','San Francisco','49ers','NFC','West'],['SEA','Seattle','Seahawks','NFC','West']
];
var ALT_ABBR = {JAC:'JAX',WSH:'WAS',LA:'LAR',LVR:'LV',OAK:'LV',SD:'LAC',STL:'LAR',KAN:'KC',KCC:'KC',GNB:'GB',NWE:'NE',NOR:'NO',SFO:'SF',TAM:'TB',ARZ:'ARI',HST:'HOU',BLT:'BAL',CLV:'CLE',SL:'LAR',NYGIANTS:'NYG',NYJETS:'NYJ'};
var POS_LIST = ['QB','RB','WR','TE','OL','DL','EDGE','LB','CB','S','K','P'];
var POS_MAP = {QB:'QB',RB:'RB',HB:'RB',FB:'RB',WR:'WR',TE:'TE',OL:'OL',OT:'OL',T:'OL',LT:'OL',RT:'OL',OG:'OL',G:'OL',LG:'OL',RG:'OL',C:'OL',IOL:'OL',OC:'OL',LS:'OL',
  DL:'DL',DT:'DL',NT:'DL',IDL:'DL',DE:'EDGE',EDGE:'EDGE',ED:'EDGE',RUSH:'EDGE',LB:'LB',ILB:'LB',MLB:'LB',OLB:'LB',WLB:'LB',SLB:'LB',
  CB:'CB',DB:'CB',NB:'CB',S:'S',FS:'S',SS:'S',SAF:'S',K:'K',PK:'K',P:'P',ST:'K',KP:'K','K/P':'K',SPEC:'K',SPT:'K'};
var SLOTS = {QB:1,RB:1,WR:3,TE:1,OL:5,DL:2,EDGE:2,LB:3,CB:3,S:2,K:1,P:1};
var SIDE = {QB:'off',RB:'off',WR:'off',TE:'off',OL:'off',K:'off',DL:'def',EDGE:'def',LB:'def',CB:'def',S:'def',P:'def'};
var WEIGHT = {QB:.30,RB:.05,WR:.07,TE:.05,OL:.05,K:.03,DL:.06,EDGE:.07,LB:.05,CB:.07,S:.05,P:.02};
var PEAK = {QB:29,RB:26,WR:27,TE:28,OL:28,DL:28,EDGE:27,LB:27,CB:27,S:28,K:31,P:31};
var RETIRE_AGE = {QB:37,RB:31,WR:33,TE:33,OL:34,DL:33,EDGE:33,LB:33,CB:32,S:33,K:39,P:39};
var DEV = [{k:'X-Factor',p:.06,b:12},{k:'Star',p:.16,b:7},{k:'Normal',p:.50,b:0},{k:'Slow',p:.17,b:-4},{k:'Bust',p:.11,b:0}];

/* ---------- state ---------- */
var S = null;
function loadInitial(){
  var emb=null, loc=null;
  try{ emb = JSON.parse(document.getElementById('league-data').textContent); }catch(e){}
  try{ loc = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(emb && loc) return (loc.savedAt||0) > (emb.savedAt||0) ? loc : emb;
  return emb || loc || null;
}
function teamById(id){ return S.teams[id]; }
function newLeague(startYear){
  var teams = TEAM_DEF.map(function(d,i){
    return {id:i,abbr:d[0],city:d[1],name:d[2],conf:d[3],div:d[4],off:Math.round(clamp(N(74,4.5),64,85)),def:Math.round(clamp(N(74,4.5),64,85)),titles:0};
  });
  S = {v:1, startYear:startYear, year:startYear, teams:teams, players:[], seasons:[], nextId:1, draftOrder:null, savedAt:0};
  // first-year draft order: weakest teams first (with some noise)
  S.draftOrder = teams.map(function(t){return {id:t.id,s:t.off+t.def+N(0,4)};}).sort(function(a,b){return a.s-b.s;}).map(function(x){return x.id;});
}

/* ---------- saving ---------- */
var artifactNS = null, saveTimer=null;
function buildDoc(){
  var json = JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' + HEAD_HTML + '\n' + STYLE_HTML + '\n<script id="league-data" type="application/json">' + json + '<\/script>\n<\/head>\n<body>\n' + SHELL_HTML + '\n' + SCRIPT_HTML + '\n<\/body>\n<\/html>\n';
}
function setSaveStatus(txt, cls){ var el=document.getElementById('savestat'); if(!el)return; el.textContent=txt; el.className='savestat '+(cls||''); }
function persist(){
  if(!S) return;
  S.savedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(!artifactNS){ setSaveStatus('Saved in this browser — use Save / Load to back up', 'warn'); return; }
  setSaveStatus('Saving league…','');
  Promise.resolve().then(function(){ return artifactNS.publish(buildDoc()); }).then(function(){
    setSaveStatus('League saved ✓','ok');
  }).catch(function(e){
    var code = (e && (e.code || e.name)) || 'error';
    if(code==='conflict'){ setSaveStatus('Another copy was saved; reloading','warn'); return; }
    setSaveStatus('Saved in this browser only ('+code+') — back up from Save / Load','warn');
  });
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); }
try{
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('artifact').then(function(ns){ artifactNS = ns || null; if(S && S.savedAt) setSaveStatus(artifactNS?'League saved ✓':'Saved in this browser', artifactNS?'ok':'warn'); }).catch(function(){});
  }
}catch(e){}

/* ---------- team / schedule / games ---------- */
function makeSchedule(){
  var weeks = [];
  var divs = {};
  S.teams.forEach(function(t){ var k=t.conf+t.div; (divs[k]=divs[k]||[]).push(t.id); });
  var rr = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  for(var pass=0;pass<2;pass++){
    rr.forEach(function(round){
      var wk=[];
      Object.keys(divs).forEach(function(k){ var d=divs[k]; round.forEach(function(p){ var h=d[p[0]],a=d[p[1]]; if(pass)wk.push([a,h]); else wk.push([h,a]); }); });
      weeks.push(wk);
    });
  }
  var played = {}; function key(a,b){return a<b?a+'-'+b:b+'-'+a;}
  weeks.forEach(function(wk){wk.forEach(function(g){played[key(g[0],g[1])]=1;});});
  var homeCt = S.teams.map(function(){return 3;});
  for(var w=0; w<11; w++){
    var wk=null;
    for(var attempt=0; attempt<300 && !wk; attempt++){
      var pool = shuffle(S.teams.map(function(t){return t.id;})), used={}, out=[], ok=true;
      for(var i=0;i<pool.length;i++){
        var a=pool[i]; if(used[a]) continue;
        var partner=-1;
        for(var j=i+1;j<pool.length;j++){ var b=pool[j]; if(!used[b] && (!played[key(a,b)] || attempt>250)){ partner=b; break; } }
        if(partner<0){ ok=false; break; }
        used[a]=used[partner]=1; out.push([a,partner]);
      }
      if(ok) wk=out;
    }
    wk.forEach(function(g){ played[key(g[0],g[1])]=1; var h=g[0],a=g[1]; if(homeCt[h]>homeCt[a]){var t=h;h=a;a=t;} g[0]=h;g[1]=a; homeCt[h]++; });
    weeks.push(wk);
  }
  return shuffle(weeks);
}
function teamScore(offEff, oppDef, homeAdv){
  var exp = 22.5 + (offEff - oppDef)*0.55 + homeAdv;
  var p = Math.round(N(exp, 8.5));

function simSeason(){

    divW.sort(cmp); rest.sort(cmp);
    seeds[cf] = divW.concat(rest.slice(0,3));
    seeds[cf].forEach(function(r,i){ r.seed=i+1; r.divWin = i<4; });
  });
  rec.forEach(function(r){ r.finish = r.seed ? 1 : 0; });
  // playoffs
  var rounds = [{name:'Wild Card',games:[]},{name:'Divisional',games:[]},{name:'Conference Championships',games:[]},{name:'Super Bowl',games:[]}];
  function pg(hr, ar, roundIdx, neutral){
    var r = playGame(ctx[hr.id], ctx[ar.id], neutral, true);
    var g = {h:hr.id,a:ar.id,hs:r.hs,as:r.as,hseed:hr.seed,aseed:ar.seed};
    rounds[roundIdx].games.push(g);

    var cc = [d1,d2].sort(function(a,b){return a.seed-b.seed;});

  var sbHome = rnd()<.5 ? champs.AFC : champs.NFC, sbAway = sbHome===champs.AFC?champs.NFC:champs.AFC;

    var role = ctx[p.teamId].roles[p.id] || {starter:false,rank:9};

  var off = {QB:1,RB:1,WR:1,TE:1,OL:1,K:0}, defn = {DL:1,EDGE:1,LB:1,CB:1,S:1};

  var poy = best(played.filter(function(p){return p.stats[Y].gp>=10;}), function(p){ return p.stats[Y].score + (p.pos==='QB'?3:0); });
  var opoy = best(played.filter(function(p){return off[p.pos] && p.pos!=='OL';}), function(p){ return p.stats[Y].score; });
  var dpoy = best(played.filter(function(p){return defn[p.pos];}), function(p){ return p.stats[Y].score; });
  var rook = played.filter(function(p){return p.draftYear===Y;});
  var oroy = best(rook.filter(function(p){return off[p.pos];}), function(p){ return p.stats[Y].score; });
  var droy = best(rook.filter(function(p){return defn[p.pos];}), function(p){ return p.stats[Y].score; });
  function give(p, label, key){ if(!p) return; p.awards.push(Y+' '+label); aw[key]=p.id; }
  give(poy,'Player of the Year','poy'); give(opoy,'Offensive Player of the Year','opoy'); give(dpoy,'Defensive Player of the Year','dpoy');
  give(oroy,'Offensive Rookie of the Year','oroy'); give(droy,'Defensive Rookie of the Year','droy');
  aw.allPro=[]; aw.proBowl=[];

    var cand = played.filter(function(p){ return p.pos===pos && p.stats[Y].gp>=10 && p.ovr>=79 && p.stats[Y].role==='Starter'; })
      .sort(function(a,b){ return b.stats[Y].score-a.stats[Y].score; });

    playoffs: rounds, champ:champ.id, runner: (sbg.hs>sbg.as?sbg.a:sbg.h), sbScore:[Math.max(sbg.hs,sbg.as),Math.min(sbg.hs,sbg.as)],
    awards: aw, rings: rings, moves:[], retired:[], changes:[], draftCount: S.players.filter(function(p){return p.draftYear===Y;}).length

  S.draftOrder = season.standings.slice().sort(function(a,b){
    return a.finish-b.finish || ((a.w+a.t*.5)/17)-((b.w+b.t*.5)/17) || (a.pf-a.pa)-(b.pf-b.pa) || rnd()-.5;

    t.def = Math.round(clamp(74 + (t.def-74)*.62 + N(0,3.6), 62, 88));

}
function prodBar(pos){ return {QB:16,RB:11,WR:11,TE:9,OL:10,DL:10,EDGE:11,LB:9,CB:9,S:8,K:9,P:6}[pos]||12; }

function offseason(season){
  var Y = season.year;
  S.players.forEach(function(p){
    if(p.retired) return;
    var before = p.ovr;
    var s = p.stats[Y];
    // free agents (no team) — sign or retire
    if(p.teamId==null){
      if(p.age>=30 || p.ovr<54 || rnd()<.35){ retire(p, season, 'unsigned'); return; }
      var t = ri(0,31); p.teamId=t; p.contractEnd=Y+ri(1,2); season.moves.push({id:p.id,txt:p.name+' signs with '+teamById(t).abbr+' (free agent)'}); p.log.push((Y+1)+': Signed with '+teamById(t).abbr);

function teamNeeds(t){
  var need={};
  POS_LIST.forEach(function(pos){
    var side = SIDE[pos]==='off'? t.off : t.def;
    var v = U(0,3.5) + (74-side)*0.12;
    var good = S.players.filter(function(p){ return !p.retired && p.teamId===t.id && p.pos===pos && p.ovr>=74; }).length;
    if(good >= SLOTS[pos]) v -= 4; else if(good>0) v -= 1.5;

function cloneRow(r){ var o={}; for(var k in r) o[k]=r[k]; return o; }
function buildDraft(userRows, genRows, mode){
  var all = userRows.map(cloneRow).concat(genRows.map(cloneRow));
  all.forEach(function(r){ r.val = r.col + (POSVAL[r.pos]||0) + N(0,2.5); r.teamAuto=false; r.pick=null; r.round=null; r.teamId=null; });
  var total = all.length;
  if(mode==='mine'){
    var taken={}, maxPick=0;
    all.forEach(function(r){ if(!r.gen && r.pickIn){ r.pick=r.pickIn; taken[r.pick]=1; maxPick=Math.max(maxPick,r.pick); } });
    total = Math.max(total, maxPick);
    var free=[]; for(var k=1;k<=total;k++) if(!taken[k]) free.push(k);
    var noPickUser = all.filter(function(r){return !r.gen && !r.pick;});
    var gens = all.filter(function(r){return r.gen;}).sort(function(a,b){return b.val-a.val;});
    noPickUser.concat(gens).forEach(function(r){ r.pick = free.shift(); });
    all.forEach(function(r){
      r.round = (!r.gen && r.roundIn && r.pick===r.pickIn) ? r.roundIn : Math.ceil(r.pick/32);
      if(!r.gen && r.teamIn!=null) r.teamId=r.teamIn; else { r.teamId=S.draftOrder[(r.pick-1)%32]; r.teamAuto=true; }
    });
  } else {
    var needs={}; S.teams.forEach(function(t){ needs[t.id]=teamNeeds(t); });
    var avail = all.slice().sort(function(a,b){return b.val-a.val;});
    for(var p=1; avail.length; p++){
      var tid = S.draftOrder[(p-1)%32];
      var best=null, bs=-1e9;
      avail.slice(0,8).forEach(function(r,i){ var sc = r.val + needs[tid][r.pos] - i*0.4; if(sc>bs){bs=sc;best=r;} });
      avail.splice(avail.indexOf(best),1);
      best.pick=p; best.round=Math.ceil(p/32); best.teamId=tid; best.teamAuto=true;
      needs[tid][best.pos] -= (SLOTS[best.pos]>2?2.5:4);
    }
  }
  all.forEach(function(r){ r.nfl = projectNFL(r.col, r.round, r.pos); });
  all.sort(function(a,b){return a.pick-b.pick;});
  return all;
}

function bindDraft(){
  var f = document.getElementById('draftFile');
  if(f) f.addEventListener('change', function(){ var file=f.files[0]; if(!file)return; var rd=new FileReader(); rd.onload=function(){ UI.draftText=rd.result; document.getElementById('draftText').value=rd.result; doParse(); }; rd.readAsText(file); });
  var ta = document.getElementById('draftText');
  if(ta) ta.addEventListener('input', function(){ UI.draftText = ta.value; });
  var dz = document.getElementById('photoDrop');
  if(dz && PHOTO.avail!==false){
    dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', function(){ dz.classList.remove('over'); });
    dz.addEventListener('drop', function(e){ e.preventDefault(); dz.classList.remove('over'); readPhotos(e.dataTransfer.files); });
  }
}
function readDraftOptions(){
  var m=document.getElementById('draftMode'), f=document.getElementById('fillTo');
  if(m) UI.draftMode=m.value; if(f) UI.fillTo=+f.value;
}
function doParse(){
  readDraftOptions();
  var res = parseDraftText(UI.draftText);
  if(!res.rows.length){ UI.draftPreview=null; UI.draftErrors=res.errors; toast(esc(res.errors[0]||'No players found.')); render(); return; }
  if(UI.draftMode==='mine' && !res.hasPicks && !res.hasTeams) res.errors.unshift('Your paste has no Pick or Team column, so the draft was simulated instead.');
  var used={}; S.players.forEach(function(p){used[p.name.toLowerCase()]=1;}); res.rows.forEach(function(r){used[r.name.toLowerCase()]=1;});
  var nGen = Math.max(0, (+UI.fillTo||0) - res.rows.length);
  UI.parsed = res; UI.genRows = generateProspects(nGen, res.rows.length+1, used);
  UI.draftPreview = buildDraft(res.rows, UI.genRows, (UI.draftMode==='mine' && (res.hasPicks||res.hasTeams))?'mine':'sim');
  UI.draftErrors = res.errors; render();
  setTimeout(function(){ var el=document.querySelector('[data-act=commit]'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, 30);
}

/* --- player filtering (shared) --- */
function filterPlayers(F){
  return S.players.filter(function(p){
    if(F.cls!=='all' && String(p.draftYear)!==String(F.cls)) return false;
    if(F.team!=='all' && String(p.teamId)!==String(F.team)) return false;
    if(F.pos!=='all' && p.pos!==F.pos) return false;
    if(F.status==='active' && p.retired) return false;
    if(F.status==='retired' && !p.retired) return false;
    if(F.src==='mine' && p.gen) return false;
    if(F.src==='gen' && !p.gen) return false;
    return true;
  });
}
function playerFilterBar(F, count){
  var classes = Object.keys(S.players.reduce(function(m,p){m[p.draftYear]=1;return m;},{})).sort();
  return '<div class="filters">'+
    sel('cls','Class',[['all','All classes']].concat(classes.map(function(c){return [c,c+' class'];})),F.cls)+
    sel('team','Team',[['all','All teams']].concat(S.teams.slice().sort(function(a,b){return a.abbr.localeCompare(b.abbr);}).map(function(t){return [String(t.id),t.abbr+' '+t.name];})),F.team)+
    sel('pos','Position',[['all','All positions']].concat(POS_LIST.map(function(p){return [p,p];})),F.pos)+
    sel('status','Status',[['active','Active'],['retired','Retired'],['all','Everyone']],F.status)+
    sel('src','Source',[['all','Yours + generated'],['mine','Only yours'],['gen','Only generated']],F.src||'all')+
    '<span class="muted small">'+count+' players · click a name for the full career</span></div>';
}
function nameCell(p){ return pLink(p)+(p.gen?'':' <span class="badge blue" title="From your import">Yours</span>')+(p.retired?' <span class="badge red">Ret '+p.retiredYear+'</span>':''); }

/* --- Players view --- */

  var F=UI.plFilter;
  var years = S.seasons.map(function(s){return s.year;});
  var list = filterPlayers(F);
  var h = '<div class="card"><h2>Players &amp; ratings by season</h2>'+playerFilterBar(F, list.length);
  var showYears = years.slice(-12);
  var cols = [
    {k:'name',l:'Player',f:nameCell,sv:function(p){return p.name;}},
    {k:'pos',l:'Pos'},
    {k:'age',l:'Age',n:1},
    {k:'team',l:'Team',f:function(p){return p.retired?'<span class="muted">—</span>':tLink(p.teamId);},sv:function(p){return tAbbr(p.teamId);}},
    {k:'draft',l:'Drafted',f:function(p){return p.draftYear+' R'+p.round+' #'+p.pick+' '+tAbbr(p.draftTeamId);},sv:function(p){return p.draftYear*1000+p.pick;}},
    {k:'col',l:'College rtg',n:1},
    {k:'dev',l:'Dev',f:devBadge,sv:function(p){return p.devKnown?({'X-Factor':5,'Star':4,'Normal':3,'Slow':2,'Bust':1}[p.dev]):0;}},
    {k:'rookie',l:'Rookie',n:1,f:function(p){return ovrBadge(p.ratings[0].ovr);},sv:function(p){return p.ratings[0].ovr;},title:'Projected NFL rating when drafted'}
  ];
  showYears.forEach(function(y){ cols.push({k:'r'+y,l:'After '+y,n:1,title:'Rating at the end of the '+y+' season',f:function(p){ var r=ratingAfter(p,y); return r!=null?ovrBadge(r):'<span class="muted">·</span>'; },sv:function(p){return ratingAfter(p,y);}}); });
  cols.push({k:'ovr',l:'Now',n:1,f:function(p){return ovrBadge(p.ovr);}});
  cols.push({k:'chg',l:'Δ',n:1,f:function(p){return deltaHtml(lastDelta(p));},sv:lastDelta,title:'Change after the most recent season'});
  cols.push({k:'aw',l:'Honors',f:function(p){ var ap=p.awards.filter(function(a){return /All-Pro/.test(a);}).length, pb=p.awards.filter(function(a){return /Pro Bowl/.test(a);}).length, sb=p.awards.filter(function(a){return /Super Bowl/.test(a);}).length, maj=p.awards.filter(function(a){return /of the Year/.test(a);}).length; return (maj?'<span class="badge gold">'+maj+'× award</span>':'')+(ap?'<span class="badge gold">'+ap+'× AP</span>':'')+(pb?'<span class="badge green">'+pb+'× PB</span>':'')+(sb?'<span class="badge blue">'+sb+'× 🏆</span>':''); },sv:function(p){return p.awards.length;}});
  h += sortable('players', cols, list, {k:'ovr',dir:-1});
  return h + '</div>';
}
function ratingAfter(p,y){ for(var i=0;i<p.ratings.length;i++){ var r=p.ratings[i]; if(r.y===y && r.s!=='Draft') return r.ovr; } return null; }

/* --- Year by year (progression + team movement) --- */
function renderCareers(){
  var F=UI.plFilter;
  var years = S.seasons.map(function(s){return s.year;});
  var list = filterPlayers(F);
  var h = '<div class="card"><h2>Year by year — team &amp; rating</h2><p class="muted small" style="margin-top:0">Each cell shows the team he played for that season and his rating at the end of it. <span style="color:var(--accent);font-weight:700">→ Gold</span> means he changed teams that year.</p>'+playerFilterBar(F, list.length);
  if(!years.length){ return h+'<div class="empty">Simulate a season to start tracking careers.</div></div>'; }
  var cols = [
    {k:'name',l:'Player',f:nameCell,sv:function(p){return p.name;}},
    {k:'pos',l:'Pos'},
    {k:'draft',l:'Drafted',f:function(p){return p.draftYear+' R'+p.round+' #'+p.pick+' <b>'+tAbbr(p.draftTeamId)+'</b> '+ovrBadge(p.ratings[0].ovr);},sv:function(p){return p.draftYear*1000+p.pick;}}
  ];
  years.slice(-15).forEach(function(y){
    cols.push({k:'y'+y,l:String(y),n:1,f:function(p){ return careerCell(p,y); },sv:function(p){ return ratingAfter(p,y); }});
  });
  cols.push({k:'moves',l:'Teams',n:1,f:function(p){ var n=teamsOf(p).length; return n>1?'<span class="badge gold">'+n+'</span>':n; },sv:function(p){return teamsOf(p).length;},title:'Number of teams played for'});
  cols.push({k:'ovr',l:'Now',n:1,f:function(p){return p.retired?'<span class="muted">Ret</span>':tAbbr(p.teamId)+' '+ovrBadge(p.ovr);}});
  h += sortable('careers', cols, list, {k:'ovr',dir:-1}) + '</div>';
  // moves by year
  var my = UI.movesYear && seasonOf(+UI.movesYear) ? +UI.movesYear : years[years.length-1], ss=seasonOf(my);
  h += '<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Player movement after the '+my+' season</h2>'+sel('movesYear','Season',S.seasons.slice().reverse().map(function(s){return [String(s.year),'After '+s.year];}),String(my),'mv')+'</div>';
  var mv = ss.moves.filter(function(m){ var p=P(m.id); return p && (F.src!=='mine' || !p.gen); });
  h += mv.length? '<ul class="list" style="columns:2;margin-top:10px">'+mv.map(function(m){ var p=P(m.id); return '<li>'+(p&&!p.gen?'<b>':'')+esc(m.txt)+(p&&!p.gen?'</b>':'')+'</li>'; }).join('')+'</ul>' : '<div class="muted" style="margin-top:10px">No moves.</div>';
  if(ss.retired.length) h += '<h3>Retired</h3><div>'+ss.retired.map(function(id){var p=P(id); return pLink(p)+' <span class="muted small">'+p.pos+'</span>';}).join(' · ')+'</div>';
  return h + '</div>';
}
function careerCell(p,y){
  if(y < p.draftYear) return '';
  var s=p.stats[y], r=ratingAfter(p,y);
  if(!s){ if(p.retired && p.retiredYear<y) return ''; return r!=null? '<div class="cc"><span class="ct">FA</span>'+ovrBadge(r)+'</div>' : ''; }
  var prev = null;
  for(var yy=y-1; yy>=p.draftYear; yy--){ if(p.stats[yy]){ prev=p.stats[yy].tid; break; } }
  if(prev==null) prev = p.draftTeamId;
  var moved = s.tid!==prev;
  return '<div class="cc'+(moved?' moved':'')+'" title="'+esc(tName(s.tid))+(moved?' (new team)':'')+'"><span class="ct">'+(moved?'→ ':'')+s.tm+'</span>'+(r!=null?ovrBadge(r):'')+(p.retiredYear===y?' <span class="badge red">Ret</span>':'')+'</div>';
}
function teamsOf(p){ var t=[]; Object.keys(p.stats).sort().forEach(function(y){ var id=p.stats[y].tid; if(t.indexOf(id)<0) t.push(id); }); if(!t.length) t.push(p.draftTeamId); return t; }
function sel(key,label,opts,val,group){
  return '<select data-filter="'+(group||'pl')+'" data-key="'+key+'" aria-label="'+label+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';
}

  rush:{l:'Rushing',pos:['RB','QB'],cols:[['car','Att',function(s){return s.car!=null?s.car:s.ratt;},function(s){return s.car!=null?s.car:s.ratt;}],['ryds','Yds'],['ypc','Avg',function(s){var a=s.car!=null?s.car:s.ratt;return a?fmt1(s.ryds/a):'-';},function(s){var a=s.car!=null?s.car:s.ratt;return a?s.ryds/a:0;}],['rtd','TD'],['lng','Lng'],['fum','Fum'],['rec','Rec'],['recyds','RecYds'],['rectd','RecTD']],def:'ryds'},
  rec:{l:'Receiving',pos:['WR','TE','RB'],cols:[['tgt','Tgt'],['rec','Rec'],['recyds','Yds'],['ypr','Avg',function(s){return s.rec?fmt1(s.recyds/s.rec):'-';},function(s){return s.rec?s.recyds/s.rec:0;}],['rectd','TD'],['lng','Lng']],def:'recyds'},
  def:{l:'Defense',pos:['EDGE','DL','LB','CB','S'],cols:[['tkl','Tkl'],['tfl','TFL'],['sck','Sck'],['qbh','QBH'],['int','INT'],['pd','PD'],['ff','FF']],def:'tkl'},
  ol:{l:'Blocking',pos:['OL'],cols:[['ska','Sacks allowed'],['pen','Penalties']],def:'gs'},
  kick:{l:'Kicking',pos:['K'],cols:[['fgm','FGM'],['fga','FGA'],['fgp','FG%',function(s){return s.fga?fmt1(s.fgm/s.fga*100):'-';},function(s){return s.fga?s.fgm/s.fga:0;}],['lng','Long'],['xpm','XPM'],['xpa','XPA']],def:'fgm'},
  punt:{l:'Punting',pos:['P'],cols:[['punts','Punts'],['pavg','Avg'],['in20','In 20']],def:'pavg'}
};
function renderStats(){

  if(F.cat==='rec') list = list.filter(function(p){ return (p.stats[y].rec||0)>0; });

    sel('cls','Class',[['all','All classes']].concat(classes.map(function(c){return [c,c+' class'];})),F.cls,'st')+sel('src','Source',[['all','Yours + generated'],['mine','Only yours'],['gen','Only generated']],F.src||'all','st')+'</div>';
  h += '<div class="subtabs">'+Object.keys(CATS).map(function(k){return '<button data-cat="'+k+'" class="'+(F.cat===k?'on':'')+'">'+CATS[k].l+'</button>';}).join('')+'</div>';
  var cols = [
    {k:'name',l:'Player',f:nameCell,sv:function(p){return p.name;}},
    {k:'pos',l:'Pos'},
    {k:'tm',l:'Team',f:function(p){return tLink(p.stats[y].tid);},sv:function(p){return p.stats[y].tm;}},
    {k:'sovr',l:'OVR',n:1,f:function(p){return ovrBadge(p.stats[y].ovr);},sv:function(p){return p.stats[y].ovr;},title:'Rating during this season'},

function gsErrText(e){
  var c = e && e.code;
  if(c==='server_not_connected'||c==='server_not_found') return 'Google Sheets isn\'t connected. Add the Google Sheets connector in claude.ai Settings → Connectors, then try again.';
  if(c==='needs_reauth') return 'Your Google Sheets connection expired. Reconnect it in claude.ai Settings → Connectors.';
  if(c==='selection_required') return 'You have more than one Google Sheets connection — choose one when Claude asks, then try again.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='not_granted') return 'This page needs your permission to use Google Sheets. Click Sync again and choose Allow.';
  if(c==='blocked_by_policy') return 'Your organization blocks this Google Sheets action.';
  if(c==='server_unavailable'||c==='rate_limited') return 'Google Sheets didn\'t answer in time. Wait a moment and try again.';
  if(c==='tool_error') return 'Google Sheets refused the update: '+String(e.message||'').slice(0,240)+' — check that the link is to a sheet you can edit.';
  return 'Sync failed ('+(c||'error')+'): '+String(e&&e.message||'').slice(0,200);
}
function gsSetStatus(t, cls){ GS.status=t; GS.statusCls=cls||''; var el=document.getElementById('gsStatus'); if(el){ el.textContent=t; el.className='small '+(cls||''); } }
function gsQuote(title){ return "'"+title.replace(/'/g,"''")+"'"; }
function syncToSheets(){
  if(!GS.mcp){ return Promise.reject({code:'capability_disabled',message:'Google Sheets sync only works inside Claude.'}); }
  if(!S.gsheet || !S.gsheet.id) return Promise.reject({code:'no_sheet',message:'Paste your Google Sheet link first.'});
  if(GS.busy) return Promise.reject({code:'busy',message:'A sync is already running.'});
  GS.busy=true;
  var id=S.gsheet.id, tabs=sheetTabs(), last=S.gsheet.lastRows||{};
  gsSetStatus('Connecting to Google Sheets…');
  var existing=[];
  return gsCall('get_spreadsheet', function(s){ return gsId(s,id); }).then(function(res){
    existing = gsFindSheets(res && (res.payload!==undefined ? res.payload : res));
    var reqs=[];
    tabs.forEach(function(t){
      var need = Math.max(t.rows.length, last[t.title]||0) + 50, cols = Math.max(26, t.rows[0].length+2);
      var ex = existing.filter(function(x){return x.title===t.title;})[0];
      if(!ex) reqs.push({addSheet:{properties:{title:t.title, gridProperties:{rowCount:Math.max(1000,need), columnCount:cols, frozenRowCount:1}}}});
      else if(ex.sheetId!=null && ((ex.rows && ex.rows<need) || (ex.cols && ex.cols<cols))) reqs.push({updateSheetProperties:{properties:{sheetId:ex.sheetId, gridProperties:{rowCount:Math.max(ex.rows||0,need+500), columnCount:Math.max(ex.cols||0,cols)}}, fields:'gridProperties.rowCount,gridProperties.columnCount'}});
    });
    if(!reqs.length) return null;
    gsSetStatus('Setting up tabs…');
    return gsCall('update_spreadsheet', function(s){ return gsArgsRequests(s,id,reqs); }).catch(function(e){
      // a tab may already exist under that name — fall back to adding tabs one at a time
      if(e && e.code==='tool_error'){
        var chain=Promise.resolve();
        reqs.forEach(function(r){ chain=chain.then(function(){ return gsCall('update_spreadsheet', function(s){ return gsArgsRequests(s,id,[r]); }).catch(function(){}); }); });
        return chain;
      }
      throw e;
    });
  }).then(function(){
    var chain=Promise.resolve(), CH=1500;
    tabs.forEach(function(t, ti){
      var width = t.rows[0].length, rows = t.rows.map(function(r){ var o=r.slice(); while(o.length<width) o.push(''); return o.map(function(v){ return v==null?'':v; }); });
      var prev = last[t.title]||0; while(rows.length<prev) rows.push(new Array(width).fill(''));
      for(var start=0; start<rows.length; start+=CH){
        (function(st){
          chain = chain.then(function(){
            gsSetStatus('Writing '+t.title+' ('+(ti+1)+'/'+tabs.length+')…');
            return gsCall('update_values', function(s){ return gsArgsValues(s, id, gsQuote(t.title)+'!A'+(st+1), rows.slice(st, st+CH)); });
          });
        })(start);
      }
      chain = chain.then(function(){ last[t.title]=t.rows.length; });
    });
    return chain;
  }).then(function(){
    S.gsheet.lastRows=last; S.gsheet.lastSync=Date.now(); S.gsheet.lastSyncYear=S.year-1;
    GS.busy=false; S.gsheet.lastMsg='Synced through the '+(S.year-1)+' season · '+new Date().toLocaleString(); gsSetStatus('Synced ✓ '+new Date().toLocaleTimeString()+' — '+tabs.length+' tabs updated','ok');
  }, function(e){ GS.busy=false; var m=gsErrText(e); if(S.gsheet) S.gsheet.lastMsg='Last sync failed: '+m; gsSetStatus(m,'bad'); throw e; });
}

/* --- Reading draft classes from photos --- */
var PHOTO={busy:false};
function photoCapable(){
  if(!(window.claude && typeof window.claude.use==='function')) return Promise.resolve(null);
  return window.claude.use('sample').then(function(s){ if(!s) return null; return s.limits().then(function(l){ return l && l.images ? {sample:s, limits:l.images} : null; }, function(){ return null; }); }, function(){ return null; });
}
var PHOTO_PROMPT = 'These images show an American football draft class or prospect list (screenshots, photos of a screen, or a printed/handwritten list). Extract every player you can read.\n\n'+
  'Reply with ONLY a JSON array. Each element: {"name": string, "position": string (as written, e.g. QB, WR, EDGE, OT, CB), "college": string or null, "rating": number or string or null (the player\'s overall rating or grade if shown; if several ratings appear use the overall one; keep letter grades like "A-" as strings), "pick": number or null (overall pick number if shown), "round": number or null, "team": string or null (NFL team if shown), "age": number or null}.\n\n'+
  'If a school is given as a city or town (for example Austin or Tallahassee), write the university it means (Texas, Florida State). Positions written as ST mean a kicker or punter: write "K" for a kicker, "P" for a punter, or "ST" if you cannot tell.\n\n'+
  'Do not invent players or numbers — use null when something is not shown. Keep the order they appear. Example: [{"name":"Jalen Whitfield","position":"QB","college":"Ohio State","rating":96,"pick":null,"round":null,"team":null,"age":null}]';
function readPhotos(files){
  files = Array.prototype.slice.call(files||[]).filter(function(f){ return /^image\//.test(f.type); });
  if(!files.length){ toast('Choose one or more images.'); return; }
  if(PHOTO.busy) return;
  PHOTO.busy=true; setPhotoStatus('Reading '+files.length+' photo'+(files.length>1?'s':'')+'… (this can take up to a minute)');
  photoCapable().then(function(cap){
    if(!cap){ throw {code:'images_unavailable'}; }
    var max = cap.limits.maxCount||5, batches=[];
    for(var i=0;i<files.length;i+=max) batches.push(files.slice(i,i+max));
    var all=[], chain=Promise.resolve();
    batches.forEach(function(b,bi){
      chain = chain.then(function(){
        if(batches.length>1) setPhotoStatus('Reading photos — batch '+(bi+1)+' of '+batches.length+'…');
        return cap.sample.json(PHOTO_PROMPT, {images:b, cache:false}).then(function(arr){ if(Array.isArray(arr)) all=all.concat(arr); });
      });
    });
    return chain.then(function(){ return all; });
  }).then(function(list){
    PHOTO.busy=false;
    var seen={}, rows=[];
    list.forEach(function(r){ if(!r || !r.name) return; var k=String(r.name).toLowerCase().trim(); if(seen[k]) return; seen[k]=1; rows.push(r); });
    if(!rows.length){ setPhotoStatus('No players could be read from those photos. Try a clearer or closer shot.','bad'); return; }
    var cols=[['pick','Pick'],['round','Round'],['name','Name'],['position','Position'],['college','College'],['rating','Rating'],['team','Team'],['age','Age']].filter(function(c){ return c[0]==='name'||c[0]==='position'||c[0]==='rating'||rows.some(function(r){return r[c[0]]!=null && r[c[0]]!=='';}); });
    var text = csv([cols.map(function(c){return c[1];})].concat(rows.map(function(r){ return cols.map(function(c){ return r[c[0]]==null?'':r[c[0]]; }); })));
    UI.draftText = text.trim();
    var ta=document.getElementById('draftText'); if(ta) ta.value=UI.draftText;
    var missing = rows.filter(function(r){return r.rating==null||r.rating==='';}).length;
    setPhotoStatus('Read '+rows.length+' players from the photos — check the list above'+(missing?' ('+missing+' had no rating shown and will be treated as 75)':'')+', then run the draft.','ok');
  }).catch(function(e){
    PHOTO.busy=false;
    var c=e&&e.code;
    var msg = c==='images_unavailable'||c==='not_granted'||c==='capability_disabled'? 'Reading photos needs this page open inside Claude, with permission to use Claude (it asks the first time).' :
      c==='image_rejected'? 'One of those images couldn\'t be read (use JPG, PNG, WebP or GIF under 20 MB).' :
      c==='rate_limited'? 'Too many requests right now — wait a minute and try again.' :
      c==='invalid_json'? 'Claude\'s answer couldn\'t be turned into a player list. Try again, or crop the photo to just the list.' :
      c==='refused'? 'Claude couldn\'t process those images.' : 'Reading the photos failed ('+(c||'error')+'). Try again.';
    setPhotoStatus(msg,'bad');
  });
}

      rows.map(function(r){ return '<tr><td>'+r.y+'</td><td>'+tLink(r.s.tid)+'</td><td class="n">'+(r.s.age||'')+'</td><td class="n">'+ovrBadge(r.s.ovr)+'</td><td class="n">'+r.s.gp+'</td><td class="n">'+r.s.gs+'</td>'+cat.cols.map(function(c){ var v = c[2]? c[2](r.s) : r.s[c[0]]; return '<td class="n">'+(v==null?'-':v)+'</td>'; }).join('')+'</tr>'; }).join('')+

function runSims(n){
  var Y0 = S.year, simmed=0;
  for(var i=0;i<n;i++){ simSeason(); simmed++; }
  reindex(); UI.draftPreview=null;
  if(S.gsheet && S.gsheet.id && S.gsheet.auto!==false && GS.mcp){ toast('Updating your Google Sheet…'); syncToSheets().then(persist, persist); } else persist();
  var ls = lastSeason();
  toast((simmed>1? 'Simulated '+Y0+'–'+ls.year+'. ':'')+'<b>'+tName(ls.champ)+'</b> won the '+ls.year+' Super Bowl.');
  UI.tab='home'; location.hash='#home'; render(); window.scrollTo(0,0);
}
function readPreviewEdits(){
  document.querySelectorAll('[data-pv]').forEach(function(el){
    var r = UI.draftPreview[+el.getAttribute('data-i')]; if(!r) return;
    var k = el.getAttribute('data-pv');
    if(k==='nfl'){ var v=parseInt(el.value,10); if(!isNaN(v)) r.nfl=clamp(v,40,99); }
    if(k==='pos'){ r.pos=el.value; }
    if(k==='team'){ var t=+el.value; if(t!==r.teamId){ r.teamId=t; r.teamAuto=false; } }
  });
}
function loadSaveText(txt){
  try{
    var d = JSON.parse(txt);
    if(!d || !d.teams || !d.players || !d.seasons) throw new Error('not a league save');
    S = d; reindex(); persist(); UI.tab='home'; location.hash='#home'; render(); toast('League loaded: '+S.players.length+' players, '+S.seasons.length+' seasons.');
  }catch(e){ toast('Could not load that backup ('+esc(e.message)+').'); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act],[data-player],[data-team],th[data-k],[data-cat]');
  if(!t) { if(e.target.id==='modalbg') closeModal(); return; }
  if(t.hasAttribute('data-player')){ e.preventDefault(); openPlayer(+t.getAttribute('data-player')); return; }
  if(t.hasAttribute('data-team')){ e.preventDefault(); openTeam(+t.getAttribute('data-team')); return; }
  if(t.hasAttribute('data-cat')){ UI.stFilter.cat=t.getAttribute('data-cat'); render(); return; }
  if(t.tagName==='TH'){
    var k=t.getAttribute('data-k'); if(!k) return; var tid=t.closest('table').getAttribute('data-tid'); if(!tid) return;
    var cur=UI.sort[tid]; UI.sort[tid] = {k:k, dir: cur&&cur.k===k ? -cur.dir : (k==='name'||k==='pos'||k==='team'||k==='tm'?1:-1)};
    render(); return;
  }
  var act = t.getAttribute('data-act');
  switch(act){
    case 'close': closeModal(); break;
    case 'newleague': { var y=parseInt(document.getElementById('startYear').value,10)||2027; newLeague(y); reindex(); persist(); UI.tab='draft'; location.hash='#draft'; render(); break; }
    case 'sim1': runSims(1); break;
    case 'sim5': runSims(5); break;
    case 'sample': UI.draftText = sampleDraft(); document.getElementById('draftText').value = UI.draftText; doParse(); break;
    case 'parse': UI.draftText = document.getElementById('draftText').value; doParse(); break;
    case 'reroll': readPreviewEdits(); UI.draftPreview.forEach(function(r){ r.nfl = projectNFL(r.col, r.round, r.pos); }); render(); break;
    case 'redraft': readPreviewEdits(); UI.draftPreview = buildDraft(UI.parsed.rows, UI.genRows, (UI.draftMode==='mine' && (UI.parsed.hasPicks||UI.parsed.hasTeams))?'mine':'sim'); render(); toast('Draft re-run.'); break;
    case 'xlsx': downloadWorkbook(); break;
    case 'gssave': { var v=document.getElementById('gsUrl').value, gid=sheetIdFromUrl(v); if(!gid){ toast('That doesn\'t look like a Google Sheets link.'); break; } S.gsheet = {id:gid, auto: S.gsheet? S.gsheet.auto : true, lastRows: (S.gsheet && S.gsheet.id===gid)? S.gsheet.lastRows : {}}; GS.status=''; render(); toast('Sheet link saved. Click Sync now.'); break; }
    case 'gssync': syncToSheets().then(function(){ persist(); render(); }, function(){ render(); }); render(); break;
    case 'photopick': document.getElementById('photoFile').click(); break;
    case 'dl': doDownload(t.getAttribute('data-kind'), +t.getAttribute('data-year')); break;
    case 'cancelpreview': UI.draftPreview=null; UI.draftErrors=[]; render(); break;
    case 'commit': { readPreviewEdits(); var n=UI.draftPreview.length; commitDraft(UI.draftPreview); UI.draftPreview=null; UI.draftErrors=[]; UI.draftText=''; reindex(); persist(); toast(n+' players added to the '+S.year+' class. Simulate the season when you\'re ready.'); UI.tab='home'; location.hash='#home'; render(); break; }
    case 'undodraft': { var Y=S.year; S.players = S.players.filter(function(p){return p.draftYear!==Y;}); reindex(); persist(); render(); toast('Removed the '+Y+' class.'); break; }
    case 'savenow': persist(); toast('Saving…'); break;
    case 'copysave': { var txt=JSON.stringify(S); try{ navigator.clipboard.writeText(txt).then(function(){toast('Backup copied — paste it into a note or file to keep it.');},function(){ fallbackCopy(txt); }); }catch(err){ fallbackCopy(txt); } break; }
    case 'dlsave': doDownload('backup'); break;
    case 'loadsave': { var el=document.getElementById('loadText'); if(el && el.value.trim()) loadSaveText(el.value.trim()); else toast('Paste a backup first, or choose a file.'); break; }
    case 'askreset': document.getElementById('resetConfirm').innerHTML = '<div class="warnbox" style="margin-top:10px">This permanently deletes the current league. <button class="btn danger" data-act="doreset">Yes, start over</button> <button class="btn" data-act="noreset">Keep my league</button></div>'; break;
    case 'noreset': document.getElementById('resetConfirm').innerHTML=''; break;
    case 'doreset': { var y2=parseInt(document.getElementById('startYear').value,10)||2027; newLeague(y2); reindex(); UI.sort={}; persist(); UI.tab='draft'; location.hash='#draft'; render(); toast('New league created. Import your '+y2+' draft.'); break; }
  }
});
function fallbackCopy(txt){
  var ta=document.getElementById('loadText'); if(ta){ ta.value=txt; ta.select(); toast('Clipboard is blocked here — the backup is selected in the box; copy it with Ctrl/Cmd+C.'); }
}
document.addEventListener('change', function(e){
  var t=e.target;
  if(t.hasAttribute('data-filter')){
    var g=t.getAttribute('data-filter'), k=t.getAttribute('data-key');
    if(g==='pl'){ UI.plFilter[k]=t.value; saveUI(); }
    else if(g==='st'){ UI.stFilter[k]=t.value; }
    else if(g==='std'){ UI.stdYear=t.value; }
    else if(g==='po'){ UI.poYear=t.value; }
    else if(g==='mv'){ UI.movesYear=t.value; }
    render(); return;
  }
  if(t.id==='photoFile'){ readPhotos(t.files); t.value=''; return; }
  if(t.id==='gsAuto'){ if(S.gsheet){ S.gsheet.auto=t.checked; scheduleSave(); } return; }
  if(t.id==='showGen'){ readPreviewEdits(); UI.showGen=t.checked; render(); return; }
  if(t.id==='draftMode'||t.id==='fillTo'){ readDraftOptions(); return; }
  if(t.id==='loadFile'){ var f=t.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ loadSaveText(rd.result); }; rd.readAsText(f); }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
function route(){
  var h = (location.hash||'').replace('#','');
  if(['home','draft','players','careers','stats','standings','playoffs','history','reports','file'].indexOf(h)>=0) UI.tab=h; else UI.tab='home';
  render();
}
window.addEventListener('hashchange', function(){ closeModal(); route(); });

/* ---------- boot ---------- */
photoCapable().then(function(c){ PHOTO.avail = !!c; if(UI.tab==='draft') render(); });
S = loadInitial();
reindex();
if(S && S.savedAt) setSaveStatus('Loaded league from '+new Date(S.savedAt).toLocaleString(), '');
route();
})();
</script>
</body>
</html>
