<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Dynasty — Draft Class Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#0b1220; --panel:#121b2e; --panel2:#18233a; --line:#24314d; --text:#e8edf7; --muted:#8f9bb5;
  --accent:#f5b83d; --accent2:#3d8bf5; --good:#3ecf8e; --bad:#f2647a; --mid:#c9d3e6;
  --afc:#e5484d; --nfc:#3d8bf5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:Oswald,Inter,sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
a{color:var(--accent2)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .ball{width:30px;height:30px}
.brand h1{font-size:20px;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:11px;font-family:Inter;letter-spacing:0;font-weight:500;text-transform:none}
.yearpill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:Oswald,Inter,sans-serif;font-size:15px}
.yearpill b{color:var(--accent)}
.savestat{margin-left:auto;color:var(--muted);font-size:12px}
.savestat.ok{color:var(--good)}
.savestat.warn{color:var(--accent)}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs a{color:var(--muted);text-decoration:none;padding:9px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:18px;margin-bottom:10px;text-transform:uppercase}
.card h3{font-size:15px;margin:14px 0 8px;text-transform:uppercase;color:var(--mid)}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.blue{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#1b2a4a,#121b2e 60%);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero .trophy{font-size:44px}
.hero h2{font-size:28px;text-transform:uppercase}
.hero .score{font-family:Oswald,Inter,sans-serif;font-size:20px;color:var(--accent)}
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:Oswald,Inter,sans-serif;font-size:20px}
.tile .s{font-size:12px;color:var(--mid)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.nosort{cursor:default}
th.sorted{color:var(--accent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:rgba(255,255,255,.03)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.tablewrap table th{background:var(--panel2)}
.plink{color:var(--text);text-decoration:none;font-weight:600;cursor:pointer}
.plink:hover{color:var(--accent)}
.tlink{cursor:pointer;font-weight:600}
.tlink:hover{color:var(--accent)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--mid);margin-left:4px;vertical-align:1px}
.badge.gold{background:#3a2c08;border-color:#7a5a12;color:var(--accent)}
.badge.green{background:#0d3324;border-color:#1c6a4a;color:var(--good)}
.badge.red{background:#3a1119;border-color:#7a2533;color:var(--bad)}
.badge.blue{background:#0f2546;border-color:#24508f;color:#8fbaff}
.ovr{display:inline-block;min-width:30px;text-align:center;font-family:Oswald,Inter,sans-serif;font-weight:600;border-radius:5px;padding:0 4px}
.o90{background:#5a3e00;color:#ffd36b}.o80{background:#103c2a;color:#5ff0aa}.o70{background:#14304f;color:#9cc7ff}.o60{background:#2a2f3b;color:#c9d3e6}.o50{background:#3a1a22;color:#ff9aa9}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 9px;font:inherit}
textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input.mini{width:62px;padding:3px 6px}
select.mini{padding:3px 6px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-weight:600;font-size:12px}
.subtabs button.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.conf-h{font-family:Oswald,Inter,sans-serif;font-size:20px;margin:6px 0 10px}
.conf-h.afc{color:var(--afc)}.conf-h.nfc{color:var(--nfc)}
.div-t{margin-bottom:12px}
.div-t h4{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 0 4px}
.seed{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#1a1300;font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-right:4px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;overflow-x:auto}
.bracket .col h4{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.game{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.game div{display:flex;justify-content:space-between;padding:5px 9px;font-size:13px}
.game div.w{font-weight:700}
.game div.l{color:var(--muted)}
.game div+div{border-top:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:1000px;width:100%;padding:20px;position:relative}
.modal .x{position:absolute;right:12px;top:10px;background:none;border:none;color:var(--muted);font-size:22px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}
.empty{padding:30px;text-align:center;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1a1300;font-weight:700;text-align:center;line-height:24px;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.list{margin:0;padding-left:18px}
.list li{margin:3px 0}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
.warnbox{border:1px solid #7a5a12;background:#2a2008;color:#ffd78a;border-radius:8px;padding:8px 12px;font-size:13px}
.cc{display:flex;gap:5px;align-items:center;justify-content:flex-end}.cc .ct{font-size:11px;color:var(--muted);min-width:30px;text-align:right}.cc.moved .ct{color:var(--accent);font-weight:700}.cc.moved .ovr{outline:1px solid var(--accent)}
.small.ok{color:var(--good)}.small.bad{color:var(--bad)}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin-top:12px}
.dropzone.over{border-color:var(--accent);background:rgba(245,184,61,.06)}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
@media (max-width:700px){.bracket{grid-template-columns:repeat(4,200px)}.brand h1{font-size:16px}}
/* ---- readability pass ---- */
:root{--muted:#a0acc4;--line:#283655}
html,body{font-size:15px;line-height:1.55}
main{padding:22px 18px 70px}
.card{padding:20px 22px;border-radius:14px}
.card h2{font-size:21px;margin-bottom:6px}
.card h3{font-size:13px;letter-spacing:.07em;margin:22px 0 10px;color:var(--accent)}
.lead{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:900px}
th,td{padding:9px 12px}
th{font-size:11.5px}
tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
tbody tr:hover{background:rgba(245,184,61,.06)}
.tablewrap td:first-child,.tablewrap th:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}
.tablewrap th:first-child{z-index:3;background:var(--panel2)}
.tablewrap tbody tr:nth-child(even) td:first-child{background:#151f34}
.badge{font-size:11px;padding:2px 7px;border-radius:5px}
.ovr{min-width:34px;font-size:14px;padding:1px 6px}
.btn{padding:9px 16px}
.filters{gap:10px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.filters select{min-width:130px}
.tile .v{font-size:22px}
.kv{font-size:14px;gap:8px 20px}
.kv span:nth-child(odd){font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.modal{max-width:1080px;padding:26px}
.modal h3{border-top:1px solid var(--line);padding-top:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.nextstep{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stepchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px}
.stepchip.done{border-color:#1c6a4a;color:var(--good)}
.stepchip.now{border-color:var(--accent);color:var(--accent)}
.lname{font-weight:700}
.yearpill .switch{margin-left:10px;font-family:Inter,sans-serif;font-size:12px;color:var(--accent2);text-decoration:none;border-left:1px solid var(--line);padding-left:10px}
.leaguerow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel2)}
.leaguerow.cur{border-color:#1c6a4a}
.leaguerow .delconfirm{flex-basis:100%}
.formgrid{display:grid;grid-template-columns:1fr 160px;gap:12px}
.formgrid label{display:flex;flex-direction:column;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.formgrid input{font-size:15px;text-transform:none;letter-spacing:0}
nav.tabs a{padding:11px 14px}
@media (max-width:700px){.formgrid{grid-template-columns:1fr}}

.aw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px 26px}
.aw-grid.wide{grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
table.aw td.aw-name{white-space:nowrap}
table.aw td.aw-team{color:var(--muted);font-size:13px;width:56px}
.aw-grid.two{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.aw-block h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:4px 0 6px}
table.aw td{vertical-align:middle;white-space:normal}
table.aw td.aw-pos{width:56px}
table.aw .aw-line{color:var(--mid);min-width:160px}
table.aw tr.aw-sub td{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:5px 10px}
.plink{font-weight:600}.tlink{font-weight:600}

.badge.arch{background:#1d2a45;border-color:#33507f;color:#b9d2ff}
.badge.lvl1{color:#ff9aa9;border-color:#7a2533}.badge.lvl2{color:#c9d3e6}.badge.lvl3{color:#9cc7ff;border-color:#24508f}.badge.lvl4{color:#5ff0aa;border-color:#1c6a4a}.badge.lvl5{color:#ffd36b;border-color:#7a5a12;background:#3a2c08}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px}
.attr-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.attr-top span{color:var(--muted)}
.attr-bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}.attr-bar i{display:block;height:100%;border-radius:4px}
.coachcard{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
.staff{display:flex;flex-direction:column}
.schemes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.schemes > div{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.yearbar{display:flex;gap:6px;flex-wrap:wrap}
.yearbar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.yearbar button.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.yearbar button:focus-visible,.plink:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
table.draftlist td{vertical-align:middle}
.trlink{color:inherit;text-decoration:none}.trlink:hover{color:var(--accent)}.trlink .small{color:var(--accent2)}
.tr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tr-side{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tr-side h4{font-size:16px;margin:0 0 10px}
.tr-list{list-style:none;margin:0;padding:0}.tr-item{padding:8px 0;border-top:1px solid var(--line)}.tr-item:first-child{border-top:0}.tr-res{margin-top:4px;font-size:14px}
.ret-list{list-style:none;padding:0}.ret-li{padding:8px 0;border-top:1px solid var(--line)}.ret-li:first-child{border-top:0}
.std-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(680px,1fr));gap:10px 28px}
.std-scroll{overflow-x:auto}
table.std{table-layout:fixed;min-width:640px}
table.std col.c-team{width:240px} table.std col.c-res{width:160px}
table.std td,table.std th{padding:8px 10px}
table.std td.std-team{overflow:hidden;text-overflow:ellipsis}
.seed.noseed{visibility:hidden}
.tcell{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.tcell .seed{flex:none;margin:0}
.res{color:var(--muted);font-size:13px}.res.lostsb{color:var(--text)}
.div-t h4{margin:14px 0 6px}

.capbar{height:8px;border-radius:4px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:6px}.capbar>div{height:100%;background:#2f855a}.capbar>div.over{background:#c0392b}.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}.capitem{border:1px solid rgba(127,127,127,.25);border-radius:8px;padding:8px 10px}
/* ===== visual refresh ===== */
:root{
  --bg:#0a101c; --panel:#111a2c; --panel2:#172238; --line:#223050; --line2:#2c3d63; --text:#eef2fa; --muted:#93a0bb; --mid:#c9d3e6;
  --accent:#f5b83d; --accent2:#4b94ff; --good:#3ecf8e; --bad:#f2647a; --red:#f2647a; --gold:#f5b83d;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
html,body{font-size:14.5px;line-height:1.5;background:radial-gradient(1200px 500px at 50% -200px,#16264a 0%,var(--bg) 60%) fixed,var(--bg)}
main{padding:22px 18px 70px}
.card{border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);border-color:var(--line)}
.card h2{font-size:19px;letter-spacing:.03em;margin-bottom:6px}
.card > h2 + .lead, .pagehead .lead{margin-top:2px}
.card h3{font-size:13px;letter-spacing:.07em;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{gap:16px}
.lead{font-size:13.5px;line-height:1.55}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.pagehead select{min-width:110px}
th,td{padding:7px 9px}
tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
tbody tr:hover{background:rgba(75,148,255,.07)}
.tablewrap{border-color:var(--line);border-radius:12px}
.btn{border-radius:9px;transition:border-color .15s,filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.tile{border-radius:12px;padding:12px 14px}
.tile .v{font-size:21px}
.hero{border-radius:16px;padding:22px 24px;background:linear-gradient(120deg,#22365f 0%,#152140 45%,#111a2c 100%);box-shadow:var(--shadow)}
.modal{border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55);padding:24px}
.modal h3{font-size:13px;letter-spacing:.07em;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);text-transform:uppercase}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* two-level navigation */
nav.tabs{display:block;padding:0 12px 0;overflow:visible}
.navgroups{display:flex;gap:4px;overflow-x:auto;padding:2px 0 0}
.navgroups a.ng{color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:10px 10px 0 0;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.navgroups a.ng:hover{color:var(--text);background:rgba(255,255,255,.03)}
.navgroups a.ng.on{color:var(--accent);background:var(--panel2);box-shadow:inset 0 3px 0 var(--accent)}
.navsub{display:flex;gap:4px;overflow-x:auto;background:var(--panel2);border-radius:0 10px 0 0;padding:6px 8px;margin-bottom:-1px}
.navsub a{color:var(--mid);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.navsub a:hover{background:rgba(255,255,255,.05);color:var(--text)}
.navsub a.on{background:var(--accent);color:#1a1300}

/* scores & box scores */
.weekbar{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 4px}
.weekbar button{min-width:36px;background:var(--panel2);border:1px solid var(--line);color:var(--mid);border-radius:8px;padding:6px 8px;font-weight:700}
.weekbar button.on{background:var(--accent);border-color:var(--accent);color:#1a1300}
.weekbar button.po{padding:6px 12px}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gamechip{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 0;color:var(--text);transition:border-color .15s,transform .1s}
.gamechip:hover{border-color:var(--accent2);transform:translateY(-1px)}

function buildDraft(userRows, genRows, mode){

    var taken={}, maxPick=0;
    all.forEach(function(r){ if(!r.gen && r.pickIn){ r.pick=r.pickIn; taken[r.pick]=1; maxPick=Math.max(maxPick,r.pick); } });
    total = Math.max(total, maxPick);

    var noPickUser = all.filter(function(r){return !r.gen && !r.pick;});
    var gens = all.filter(function(r){return r.gen;}).sort(function(a,b){return b.val-a.val;});
    noPickUser.concat(gens).forEach(function(r){ r.pick = free.shift(); });

      needs[tid][best.pos] -= (SLOTS[best.pos]>2?2.5:4);

function fpts(s){
  if(!s || !s.gp) return 0;
  var f = 0;
  if(s.att!=null) f += (s.pyds||0)/25 + (s.ptd||0)*4 - (s.int||0)*2;
  f += (s.ryds||0)/10 + (s.rtd||0)*6;
  f += (s.rec||0) + (s.recyds||0)/10 + (s.rectd||0)*6;
  f -= (s.fum||0)*2;
  if(s.fgm!=null) f += s.fgm*3 + (s.xpm||0);
  if(s.tkl!=null) f += s.tkl + (s.sck||0)*2 + (s.int||0)*3 + (s.pd||0) + (s.ff||0)*2;
  return Math.round(f*10)/10;

function syncToSheets(){

  if(!S.gsheet || !S.gsheet.id) return Promise.reject({code:'no_sheet',message:'Paste your Google Sheet link first.'});

    existing = gsFindSheets(res && (res.payload!==undefined ? res.payload : res));

      var need = Math.max(t.rows.length, last[t.title]||0) + 50, cols = Math.max(26, t.rows[0].length+2);

function seeded(a, b){
  var h = 2166136261 ^ a; h = Math.imul(h ^ (b * 2654435761), 16777619) >>> 0;
  return function(){ h |= 0; h = h + 0x6D2B79F5 | 0; var t = Math.imul(h ^ h >>> 15, 1 | h); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

function sN(r, m, s){ var u = 1 - r(), v = r(); return m + s * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

function weeksIn(s){ var m = 0; s.standings.forEach(function(r){ (r.results||[]).forEach(function(g){ if(g[0]>m) m=g[0]; }); }); return m; }

// Splits a player's season totals into game-by-game lines that add back up to the totals.
var GLCACHE = {};
var SPLIT_KEYS = ['cmp','att','pyds','ptd','int','sk','ratt','ryds','rtd','car','tgt','rec','recyds','rectd','fum','tkl','sck','tfl','pd','ff','qbh','fga','fgm','xpa','xpm','punts','in20'];
function alloc(total, w){
  var out = w.map(function(){ return 0; }); if(!total || !w.length) return out;
  var sw = w.reduce(function(a,b){return a+b;},0) || 1, rem = [], used = 0;
  w.forEach(function(x,i){ var v = total*x/sw; out[i] = Math.floor(v); used += out[i]; rem.push([v-out[i], i]); });

}
function gameLines(p, y){
  var key = p.id+'-'+y; if(GLCACHE[key]) return GLCACHE[key];
  var s = statsOf(p, y), ss = seasonOrLive(y); if(!s || !ss || !s.gp) return (GLCACHE[key] = {});
  var res = teamResults(ss, s.tid).slice().sort(function(a,b){ return a[0]-b[0]; });
  var miss = missedWeeks(p, y), r = seeded(p.id, y);
  var played = res.filter(function(g){ return !miss[g[0]]; });
  if(played.length > s.gp) played = played.slice(0, s.gp);
  if(!played.length) return (GLCACHE[key] = {});
  var off = SIDE[p.pos]==='off';
  var w = played.map(function(g){
    var pts = g[3], opp = g[4];
    var base = off ? 1 + (pts-23)/23*0.55 : 1 + (opp-21)/21*0.15;
    return Math.max(0.12, base + sN(r, 0, .32));
  });

  SPLIT_KEYS.forEach(function(k){
    if(!s[k]) return;
    var v = s[k], half = (k==='sck'), tot = half ? Math.round(v*2) : Math.round(v);
    var a = alloc(tot, w);
    played.forEach(function(g,i){ if(a[i]) lines[g[0]][k] = half ? a[i]/2 : a[i]; });
  });
  played.forEach(function(g){ var L = lines[g[0]];
    if(L.cmp > L.att) L.cmp = L.att;
    if(L.rec > (L.tgt||L.rec)) L.tgt = L.rec;
    if(L.fgm > (L.fga||0)) L.fga = L.fgm;
    if(L.xpm > (L.xpa||0)) L.xpa = L.xpm;
    if(L.punts && s.pavg) L.pavg = Math.round((s.pavg + sN(r,0,2.5))*10)/10;
  });
  return (GLCACHE[key] = lines);
}
// playoff games: one game at the player's normal per-game level, with some noise
function playoffLine(p, y, gameId, teamPts){
  var s = p.stats[y]; if(!s || !s.gp) return null;
  var r = seeded(p.id*7 + gameId, y), off = SIDE[p.pos]==='off';

  SPLIT_KEYS.forEach(function(k){ if(!s[k]) return; var v = s[k]/s.gp*f; v = k==='sck' ? Math.round(v*2 + (r()-.5))/2 : Math.round(v + (r()-.5)*.8); if(v>0) L[k]=v; });

  var kick = list.filter(function(x){ return x.L.fga || x.L.xpa; });
  return tbl('Passing', pass, [['C/Att',function(L){return (L.cmp||0)+'/'+L.att;}],['Yds',function(L){return L.pyds||0;}],['TD',function(L){return L.ptd||0;}],['Int',function(L){return L.int||0;}],['Rtg',function(L){ return passerRating(L.cmp||0,L.att,L.pyds||0,L.ptd||0,L.int||0); }]]) +
    tbl('Rushing', rush, [['Car',function(L){return L.car||L.ratt||0;}],['Yds',function(L){return L.ryds||0;}],['Avg',function(L){ var c=L.car||L.ratt||0; return c? ((L.ryds||0)/c).toFixed(1) : '—'; }],['TD',function(L){return L.rtd||0;}]]) +

    tbl('Defense', def, [['Tkl',function(L){return L.tkl||0;}],['Sacks',function(L){return L.sck||0;}],['TFL',function(L){return L.tfl||0;}],['Int',function(L){return SIDE[L.pos]==='off'?0:(L.int||0);}],['PD',function(L){return L.pd||0;}]]) +

/* ---------- head-to-head & rivalries ---------- */
function allMeetings(a, b){
  var out = [];
  S.seasons.forEach(function(s){
    teamResults(s, a).forEach(function(g){ if(g[1]===b) out.push({y:s.year, wk:g[0], us:g[3], them:g[4], home:g[2]}); });
    (s.playoffs||[]).forEach(function(rd){ rd.games.forEach(function(g){
      if(g.h===a && g.a===b) out.push({y:s.year, po:rd.name, us:g.hs, them:g.as});
      else if(g.a===a && g.h===b) out.push({y:s.year, po:rd.name, us:g.as, them:g.hs});
    }); });
  });
  return out;
}
function h2hRecord(a, b){
  var r = {w:0,l:0,t:0,po:0,close:0,games:0,last:null};
  allMeetings(a, b).forEach(function(m){ r.games++; if(m.us>m.them) r.w++; else if(m.us<m.them) r.l++; else r.t++; if(m.po) r.po++; if(Math.abs(m.us-m.them)<=7) r.close++; r.last = m; });

}

function topRivalries(n){

/* ---------- record book ---------- */
var REC_CATS = [
  {k:'pyds', l:'Passing yards'}, {k:'ptd', l:'Passing TDs'}, {k:'ryds', l:'Rushing yards'}, {k:'rtd', l:'Rushing TDs'},
  {k:'rec', l:'Receptions'}, {k:'recyds', l:'Receiving yards'}, {k:'rectd', l:'Receiving TDs'},
  {k:'sck', l:'Sacks', def:1}, {k:'int', l:'Interceptions', def:1}, {k:'tkl', l:'Tackles', def:1},
  {k:'fpts', l:'Fantasy points (PPR)', f:1}

function recVal(p, s, c){
  if(c.f) return ['QB','RB','WR','TE'].indexOf(p.pos)>=0 ? Math.round(fpts(s)*10)/10 : 0;
  if(c.def && SIDE[p.pos]!=='def') return 0;

}
function seasonTop(c, n, beforeY){
  var out = [];

function careerVal(p, c, uptoY){ var t = 0; Object.keys(p.stats).forEach(function(y){ if(uptoY!=null && +y>uptoY) return; t += recVal(p, p.stats[y], c); }); return Math.round(t*10)/10; }

  return S.players.map(function(p){ return {p:p, v:careerVal(p, c)}; }).filter(function(x){ return x.v>0; }).sort(function(a,b){ return b.v-a.v; }).slice(0, n);
}
function teamSeasonRecords(){

// after each season: note new single-season and career records
function checkRecords(season){
  var Y = season.year; if(S.seasons.length < 1) return;
  S.recHold = S.recHold || {};
  REC_CATS.forEach(function(c){
    var prev = seasonTop(c, 1, Y)[0], cur = seasonTop(c, 1)[0];
    if(cur && cur.y===Y && prev && cur.v > prev.v && S.seasons.length >= 4){
      var txt = Y+' Single-season '+c.l.toLowerCase()+' record ('+fmtN(cur.v)+')';
      cur.p.records = cur.p.records || []; cur.p.records.push(txt); cur.p.log.push(Y+': Set the league single-season record for '+c.l.toLowerCase()+' ('+fmtN(cur.v)+', old record '+fmtN(prev.v)+' by '+prev.p.name+')');
      news('record', pn(cur.p)+' set the single-season '+c.l.toLowerCase()+' record with '+fmtN(cur.v)+' (old record: '+fmtN(prev.v)+' by '+esc(prev.p.name)+', '+prev.y+')', 9, [cur.p.id]);
    }
    var top = careerTop(c, 1)[0];
    if(top){
      var old = S.recHold[c.k];
      if(old != null && old !== top.p.id && top.p.stats[Y] && S.seasons.length >= 6){
        top.p.records = top.p.records || []; top.p.records.push(Y+' Became the all-time '+c.l.toLowerCase()+' leader');
        top.p.log.push(Y+': Became the league\'s all-time leader in '+c.l.toLowerCase());
        news('record', pn(top.p)+' passed '+esc((P(old)||{name:'the old leader'}).name)+' to become the all-time leader in '+c.l.toLowerCase()+' ('+fmtN(top.v)+')', 8, [top.p.id]);
      }
      S.recHold[c.k] = top.p.id;
    }
  });
}

/* ---------- Hall of Fame ---------- */
var HOF_WAIT = 5;
function honorsCount(p){
  var c = {poy:0, opoy:0, dpoy:0, ap:0, pb:0, ring:0, roy:0};
  p.awards.forEach(function(a){
    if(/ Player of the Year/.test(a) && !/Offensive|Defensive/.test(a)) c.poy++;
    else if(/Offensive Player of the Year/.test(a)) c.opoy++;
    else if(/Defensive Player of the Year/.test(a)) c.dpoy++;
    else if(/Rookie of the Year/.test(a)) c.roy++;
    else if(/All-Pro/.test(a)) c.ap++;
    else if(/Pro Bowl/.test(a)) c.pb++;
    else if(/Champion/.test(a)) c.ring++;
  });
  return c;

/* ---------- contracts: franchise tag, dead money, holdouts, extensions ---------- */
function tagValue(pos, Y){
  var top = S.players.filter(function(p){ return !p.retired && p.pos===pos && p.teamId!=null && p.salary; }).map(function(p){ return p.salary; }).sort(function(a,b){ return b-a; }).slice(0,5);
  var avg = top.length ? top.reduce(function(a,b){return a+b;},0)/top.length : marketValue({pos:pos, ovr:90, age:27}, Y);
  return Math.round(avg*10)/10;
}
function deadCharge(p, tid, Y){
  if(!p.salary || p.contractEnd==null) return 0;
  var left = p.contractEnd - Y + 1; if(left <= 0) return 0;
  var amt = Math.round(p.salary * Math.min(.6, .2*left) * 10)/10;
  if(amt < .5) return 0;
  var t = teamById(tid); t.dead = t.dead || {}; t.dead[Y] = Math.round(((t.dead[Y]||0) + amt)*10)/10;
  t.deadList = t.deadList || []; t.deadList.push({y:Y, id:p.id, n:p.name, a:amt});
  t.deadList = t.deadList.filter(function(d){ return d.y >= Y-1; });
  return amt;
}
function deadMoney(tid, Y){ var t = teamById(tid); return (t && t.dead && t.dead[Y]) || 0; }
function contractEvents(season, TAGGED){
  var Y = season.year;
  S.players.forEach(function(p){
    if(p.retired || p.teamId==null || p.contractEnd==null) return;
    var t = teamById(p.teamId), mv = marketValue(p, Y+1);
    // rookie extensions: a good young player entering the last year of his rookie deal
    if(!p.vet && !p.extended && p.contractEnd===Y+1 && Y+1 - p.draftYear <= 4 && p.ovr>=80 && p.age<=26 && rnd()<.75){
      var room = capSpace(p.teamId, Y+1) + (p.salary||0);
      if(room >= mv){
        var yrs = p.ovr>=88 ? ri(4,5) : ri(3,4);
        var rec = mv > (S.payRec && S.payRec[p.pos] || 0);
        signContract(p, mv, Y+1+yrs); p.extended = true;
        addTx(p, Y, 'Contract', 'Signed a '+yrs+'-year extension with '+t.abbr+' ('+contractTxt(mv, yrs)+')', season);
        if(p.ovr>=86 || rec) news('ext', pn(p)+' ('+p.pos+', '+p.ovr+') signed a '+yrs+'-year, '+fmtM(mv*yrs)+' extension with the '+tn(t.id)+(rec?' — the richest '+p.pos+' contract in league history':''), rec?7:5, [p.id]);
        return;
      }
    }
    // holdouts: stars playing on cheap deals
    if(p.ovr>=88 && p.age<=30 && p.contractEnd>=Y+1 && (p.salary||0) < mv*.5 && rnd()<(hasT(p,'DV')?.55:hasT(p,'TF')?.08:.25)){
      var room2 = capSpace(p.teamId, Y+1) + (p.salary||0);
      if(room2 >= mv && rnd()<.7){
        var y2 = ri(3,5);
        signContract(p, mv, Y+1+y2); p.extended = true;
        addTx(p, Y, 'Contract', 'Held out, then got a new deal from '+t.abbr+' ('+contractTxt(mv, y2)+')', season);
        news('holdout', pn(p)+' held out of camp and got paid: '+contractTxt(mv, y2)+' from the '+tn(t.id), 6, [p.id]);
      } else {
        p.holdout = ri(1,4);

        news('holdout', pn(p)+' is holding out from the '+tn(t.id)+' for a new deal and could miss '+p.holdout+' game'+(p.holdout>1?'s':''), 6, [p.id]);
      }
    }
  });
}

function logCoachSeason(season){

function settleCoachMoves(before, season){

    if(prev){ x.c.id = prev.c.id; x.c.car = prev.c.car; x.c.moves = (prev.c.moves||[]).concat([Y+': Hired as '+ROLE_NAME[x.role].toLowerCase()+' of the '+tName(x.tid)+' (was '+ROLE_NAME[prev.role].toLowerCase()+' of '+teamById(prev.tid).abbr+')']); prev.moved = true; }
  });
  ensureCoachIds();
  currentCoaches().forEach(function(x){ if(!before[x.c.id] && !(x.c.moves||[]).length){ x.c.moves = [(Y+1)+': Hired as '+ROLE_NAME[x.role].toLowerCase()+' of the '+tName(x.tid)]; } afterNames[x.c.id]=1; });

    var b = before[id]; if(afterNames[id] || b.moved) return;

    else why = 'Fired';

    if(b.role===0 && (t.coachHist||[]).length){ var lh = t.coachHist[t.coachHist.length-1]; if(lh.name===b.c.name) lh.cid = b.c.id; }

function ensureIdentity(p){

  var spd = attrVal(p, 'SPD'), str = (ATTRS[p.pos]||[]).indexOf('STR')>=0 ? attrVal(p, 'STR') : 70;
  p.ht = Math.round(sN(r, m[0], m[1]));
  p.wt = Math.round(sN(r, m[2], m[3]) + (str-70)*.35 - (spd-75)*.2);
  if(m[4]) p.f40 = Math.round(clamp(sN(r, m[4], .04) - (spd-75)*.0065 + (p.pos==='QB' && p.mob ? -p.mob*.3 : 0), 4.25, 5.6)*100)/100;

  p.comp = list[Math.floor(r()*list.length)];

function applyTraits(p, s){

      case 'GM': m('int',.72); m('pyds',.96); if(s.att) s.cmp = Math.min(s.att, Math.round(s.cmp*1.02)); break;
      case 'DB': m('pyds',1.05); m('ptd',1.05); break;
      case 'PP': m('sk',.72); break;
      case 'EA': m('sk',.8); m('ryds',1.12); break;
      case 'GL': m('rtd',1.3); break;
      case 'TD': if(p.pos==='RB'){ m('rec',1.3); m('recyds',1.25); } break;
      case 'BS': m('fum',.35); break;

var GRADE_TBL = [[1.9,'A+'],[1.35,'A'],[.9,'A-'],[.5,'B+'],[.12,'B'],[-.25,'B-'],[-.6,'C+'],[-1,'C'],[-1.4,'C-'],[-1.8,'D'],[-99,'F']];

function computeDraftRecap(Y){
  var cls = S.players.filter(function(p){ return p.draftYear===Y && !p.vet && !p.dr; });
  if(!cls.length) return;
  var all = S.players.filter(function(p){ return p.draftYear===Y && !p.vet; });
  var board = all.slice().sort(function(a,b){ var am = a.scout?(a.scout[0]+a.scout[1])/2:a.ovr, bm = b.scout?(b.scout[0]+b.scout[1])/2:b.ovr; return bm-am || a.pick-b.pick; });
  cls.forEach(function(p){

    var mates = S.players.filter(function(q){ return !q.retired && q.teamId===p.draftTeamId && q.pos===p.pos && !(q.draftYear===Y && !q.vet); });
    var ahead = mates.filter(function(q){ return q.ovr >= p.ovr; }).length, slots = SLOTS[p.pos]||1;
    var bestAt = mates.reduce(function(m,q){ return Math.max(m, q.ovr); }, 0);
    var need = ahead < slots ? 2 : ahead < slots+2 ? 1 : 0;
    var fit = schemeFit(p, t).label;
    var spread = p.round===1 ? 7 : p.round===2 ? 14 : 22;
    var v = clamp((p.pick - b)/spread, -1.6, 1.6)*.65 + (need===2?.35:need===1?.05:-.35) + (fit==='Great fit'?.35:fit==='Poor fit'?-.5:0) + (bestAt<72 && need?.15:0) - .15;
    if(p.pos==='K'||p.pos==='P') v -= p.round<=2 ? 1 : .2;
    p.dr = {b:b, n:need, f:fit==='Great fit'?'G':fit==='Poor fit'?'P':fit==='OK fit'?'O':'-', g:letter(v)};
  });
  // headline
  var teamsG = draftTeamGrades(Y), best = teamsG[0], worst = teamsG[teamsG.length-1], first = all.slice().sort(function(a,b){ return a.pick-b.pick; })[0];
  NEWS_Y = Y-1;
  if(first) news('draft', 'The '+tn(first.draftTeamId)+' opened the '+Y+' draft with '+pn(first)+' ('+first.pos+', '+esc(first.college||'')+'). Best class: '+tn(best.id)+' ('+best.g+'); worst: '+tn(worst.id)+' ('+worst.g+')', 6, [first.id]);
  NEWS_Y = null;
}
function draftTeamGrades(Y){
  var by = {};
  S.players.filter(function(p){ return p.draftYear===Y && !p.vet && p.dr; }).forEach(function(p){ (by[p.draftTeamId] = by[p.draftTeamId]||[]).push(p); });
  return Object.keys(by).map(function(id){ var l = by[id], w = 0, s = 0;
    l.forEach(function(p){ var k = p.round===1?2:p.round===2?1.4:1; w += k; s += gradeNum(p.dr.g)*k; });
    var avg = s/w + Math.min(.3, (l.length-2)*.08);
    return {id:+id, picks:l.sort(function(a,b){ return a.pick-b.pick; }), v:avg, g:letter(avg)}; }).sort(function(a,b){ return b.v-a.v; });
}
function pickReport(p){
  var d = p.dr, t = teamById(p.draftTeamId), r = seeded(p.id, 31);
  var val = d.b < p.pick - 4 ? pickR(r,['Great value — ','A steal here: ','Fell right into their lap: '])+'the '+ordinal(d.b)+' player on the consensus board went '+ordinal(p.pick)+'. ' :
            d.b > p.pick + 6 ? pickR(r,['A reach — ','They went off the board: ','Higher than most had him: '])+'he was the '+ordinal(d.b)+' player on the consensus board. ' :
            'Right about where he was projected (consensus #'+d.b+'). ';
  var need = d.n===2 ? 'Fills an immediate need — he should '+(p.ovr>=72?'start from day one':'compete for a starting job')+'.' : d.n===1 ? 'Adds depth and should rotate in early.' : 'A luxury pick — the '+esc(t.abbr)+' are already set at '+p.pos+'.';
  var fit = d.f==='G' ? ' A great scheme fit: a '+esc(p.arch)+' is exactly what the '+esc(schemeFit(p,t).scheme||'')+' wants.' : d.f==='P' ? ' Scheme concern: a '+esc(p.arch)+' is a poor fit for what the '+esc(t.abbr)+' run.' : '';
  return val + need + fit;
}
function draftRecapHTML(Y){
  var cls = S.players.filter(function(p){ return p.draftYear===Y && !p.vet; }).sort(function(a,b){ return a.pick-b.pick; });
  if(!cls.some(function(p){ return p.dr; })) computeDraftRecap(Y);
  var tg = draftTeamGrades(Y);
  var steals = cls.filter(function(p){ return p.dr; }).sort(function(a,b){ return (b.pick-b.dr.b)-(a.pick-a.dr.b); }).slice(0,5);
  var reaches = cls.filter(function(p){ return p.dr; }).sort(function(a,b){ return (a.pick-a.dr.b)-(b.pick-b.dr.b); }).slice(0,5);
  var played = cls.some(function(p){ return Object.keys(p.stats).length; });
  var h = '<p class="lead">Grades are given on draft night: value (where the player went versus the consensus board built from scouting), team need and scheme fit. '+(played?'"So far" shows how each pick has actually turned out.':'')+'<\/p>';
  h += '<div class="grid g2"><div class="recbox"><div class="rb-h">Best value picks<\/div><ol class="reclist">'+steals.map(function(p){ return '<li><span>'+pLink(p, p.draftTeamId)+' <span class="muted small">#'+p.pick+' · board #'+p.dr.b+'<\/span><\/span><b>'+esc(teamById(p.draftTeamId).abbr)+'<\/b><\/li>'; }).join('')+'<\/ol><\/div>'+
       '<div class="recbox"><div class="rb-h">Biggest reaches<\/div><ol class="reclist">'+reaches.map(function(p){ return '<li><span>'+pLink(p, p.draftTeamId)+' <span class="muted small">#'+p.pick+' · board #'+p.dr.b+'<\/span><\/span><b>'+esc(teamById(p.draftTeamId).abbr)+'<\/b><\/li>'; }).join('')+'<\/ol><\/div><\/div>';
  h += '<h3>Team grades<\/h3><div class="tgrades">'+tg.map(function(x){ return '<div class="tg"><span class="gr '+gradeClass(x.g)+'">'+x.g+'<\/span><div>'+tLink(x.id, true)+'<div class="small muted">'+x.picks.map(function(p){ return '#'+p.pick+' '+esc(p.name.split(' ').slice(-1)[0])+' ('+p.pos+')'; }).join(', ')+'<\/div><\/div><\/div>'; }).join('')+'<\/div>';
  h += '<h3>Pick-by-pick report<\/h3><div class="picks">'+cls.filter(function(p){ return p.dr; }).map(function(p){
    var so = Object.keys(p.stats).length ? '<div class="small" style="margin-top:6px"><b>So far:<\/b> '+careerSummary(p)+' · rating '+p.ovr+' (peak '+peak(p)+') '+draftGrade(p)+'<\/div>' : '';
    return '<div class="pickcard"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:10px"><div><span class="pk">#'+p.pick+'<\/span> '+pLink(p, p.draftTeamId)+' <span class="muted small">'+p.pos+' · '+esc(p.arch||'')+' · '+esc(p.college||'')+'<\/span><div class="small muted">'+esc(teamById(p.draftTeamId).city+' '+teamById(p.draftTeamId).name)+' · scouted '+(p.scout?p.scout[0]+'–'+p.scout[1]:'—')+' · rookie rating '+p.ratings[0].ovr+'<\/div><\/div><span class="gr '+gradeClass(p.dr.g)+'">'+p.dr.g+'<\/span><\/div>'+
      '<p class="small" style="margin:8px 0 0">'+pickReport(p)+' '+scoutingReport(p)+'<\/p>'+so+'<\/div>';
  }).join('')+'<\/div>';
  return h;
}

document.addEventListener('click', function(e){
  if(e.target.closest('[data-fan]')){ UI.stFilter.cat='fan'; }
  var gm = e.target.closest('[data-game]'); if(gm){ e.preventDefault(); var gy=+gm.getAttribute('data-game'); if(gm.hasAttribute('data-po')){ var pp=gm.getAttribute('data-po').split('-'); openGame(gy, null, null, null, {r:+pp[0], i:+pp[1]}); } else openGame(gy, +gm.getAttribute('data-wk'), +gm.getAttribute('data-h'), +gm.getAttribute('data-a')); return; }
  var wkw = e.target.closest('[data-wkweek]'); if(wkw){ UI.wkWeek = +wkw.getAttribute('data-wkweek'); render(); return; }
  var dv = e.target.closest('[data-dview]'); if(dv){ UI.dView = dv.getAttribute('data-dview'); render(); return; }
  var scw = e.target.closest('[data-scweek]'); if(scw){ UI.scWeek = scw.getAttribute('data-scweek'); render(); return; }
  var rct = e.target.closest('[data-rectab]'); if(rct){ UI.recTab = rct.getAttribute('data-rectab'); render(); return; }
  var nk = e.target.closest('[data-newskind]'); if(nk){ UI.newsKind = nk.getAttribute('data-newskind'); render(); return; }
  var co = e.target.closest('[data-coach]'); if(co){ e.preventDefault(); openCoach(+co.getAttribute('data-coach')); return; }
  var cb = e.target.closest('[data-cmpbtn]'); if(cb){ UI.cmp = UI.cmp || [null,null]; var cid=+cb.getAttribute('data-cmpbtn'); if(UI.cmp[0]==null || UI.cmp[0]===cid) UI.cmp[0]=cid; else UI.cmp[1]=cid; if(UI.cmp[1]==null){ toast('Added to Compare — open another player and press Compare, or pick one on the Compare tab.'); } else { closeModal(); location.hash='#compare'; } return; }
  var trl = e.target.closest('[data-trade]'); if(trl){ e.preventDefault(); openTrade(+trl.getAttribute('data-trade')); return; }
  var dy = e.target.closest('[data-dyear]'); if(dy){ UI.dYear = dy.getAttribute('data-dyear'); render(); return; }
  var ct = e.target.closest('[data-coachtab]'); if(ct){ UI.coachTab = ct.getAttribute('data-coachtab'); render(); return; }
  var t = e.target.closest('[data-act],[data-player],[data-team],th[data-k],[data-cat]');
  if(!t) { if(e.target.id==='modalbg') closeModal(); return; }
  if(t.hasAttribute('data-player')){ e.preventDefault(); openPlayer(+t.getAttribute('data-player')); return; }
  if(t.hasAttribute('data-team')){ e.preventDefault(); openTeam(+t.getAttribute('data-team')); return; }
  if(t.hasAttribute('data-cat')){ UI.stFilter.cat=t.getAttribute('data-cat'); render(); return; }
  if(t.tagName==='TH'){
    var k=t.getAttribute('data-k'); if(!k) return; var tid=t.closest('table').getAttribute('data-tid'); if(!tid) return;
    var cur=UI.sort[tid]; UI.sort[tid] = {k:k, dir: cur&&cur.k===k ? -cur.dir : (k==='name'||k==='pos'||k==='team'||k==='tm'?1:-1)};
    render(); return;
  }
  var act = t.getAttribute('data-act');
  switch(act){
    case 'close': closeModal(); break;
    case 'newleague': { var y=parseInt(document.getElementById('startYear').value,10)||2027, nm=(document.getElementById('leagueName').value||'').trim(); archiveActive(); newLeague(y); S.name = nm || ('League from '+y); DOC.active=S; reindex(); UI.sort={}; UI.draftPreview=null; persist(); UI.tab='draft'; location.hash='#draft'; render(); toast('New league created: '+esc(leagueName(S))+'. Import your '+y+' draft.'); break; }
    case 'exitleague': { archiveActive(); persist(); UI.tab='leagues'; UI.draftPreview=null; location.hash='#leagues'; render(); toast('League closed and saved in your list.'); break; }
    case 'openleague': { openArchived(t.getAttribute('data-key')); if(S && !S.vetsSeeded && !S.seasons.length) seedVeterans(); reindex(); UI.sort={}; UI.draftPreview=null; persist(); UI.tab='home'; location.hash='#home'; render(); toast('Opened '+esc(leagueName(S))+'.'); break; }
    case 'dlleague': { var la=DOC.archived.filter(function(x){return x.key===t.getAttribute('data-key');})[0]; if(la) downloadFile('gridiron-dynasty-'+la.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json', SER(la.data)); break; }
    case 'delleague': { var k=t.getAttribute('data-key'); document.getElementById('del-'+k).innerHTML='<div class="warnbox" style="margin-top:8px">Delete this league for good? <button class="btn danger" data-act="delyes" data-key="'+esc(k)+'">Yes, delete</button> <button class="btn" data-act="delno" data-key="'+esc(k)+'">Keep it</button></div>'; break; }
    case 'delno': document.getElementById('del-'+t.getAttribute('data-key')).innerHTML=''; break;
    case 'delyes': { var k2=t.getAttribute('data-key'); DOC.archived = DOC.archived.filter(function(x){return x.key!==k2;}); persist(); render(); toast('League deleted.'); break; }
    case 'sim1': runSims(1); break;
    case 'simweek': simWeeks(null); break;
    case 'simreg': simWeeks(17); break;
    case 'simfinish': runSims(1); break;
    case 'sim5': runSims(5); break;
    case 'sample': UI.draftText = sampleDraft(); document.getElementById('draftText').value = UI.draftText; doParse(); break;
    case 'parse': UI.draftText = document.getElementById('draftText').value; doParse(); break;
    case 'reroll': readPreviewEdits(); UI.draftPreview.forEach(function(r){ r.nfl = projectNFL(r.col, r.round, r.pos); }); applyRookieStars(UI.draftPreview); render(); break;
    case 'redraft': readPreviewEdits(); UI.draftPreview = buildDraft(UI.parsed.rows, UI.genRows, (UI.draftMode==='mine' && (UI.parsed.hasPicks||UI.parsed.hasTeams))?'mine':'sim'); render(); toast('Draft re-run.'); break;
    case 'showall': UI.showAll = UI.showAll||{}; UI.showAll[t.getAttribute('data-tid')] = true; render(); break;
    case 'xlsx': downloadWorkbook(); break;
    case 'gssave': { var v=document.getElementById('gsUrl').value, gid=sheetIdFromUrl(v); if(!gid){ toast('That doesn\'t look like a Google Sheets link.'); break; } S.gsheet = {id:gid, auto: S.gsheet? S.gsheet.auto : true, lastRows: (S.gsheet && S.gsheet.id===gid)? S.gsheet.lastRows : {}}; GS.status=''; render(); toast('Sheet link saved. Click Sync now.'); break; }
    case 'gssync': syncToSheets().then(function(){ persist(); render(); }, function(){ render(); }); render(); break;
    case 'photopick': document.getElementById('photoFile').click(); break;
    case 'dl': doDownload(t.getAttribute('data-kind'), +t.getAttribute('data-year')); break;
    case 'cancelpreview': UI.draftPreview=null; UI.draftErrors=[]; render(); break;
    case 'commit': { if(S.live){ toast('Finish the '+S.live.y+' season first — the next draft happens after it.'); break; } readPreviewEdits(); var n=UI.draftPreview.length; commitDraft(UI.draftPreview); UI.draftPreview=null; UI.draftErrors=[]; UI.draftText=''; reindex(); persist(); toast(n+' players added to the '+S.year+' class. Simulate the season when you\'re ready.'); UI.tab='home'; location.hash='#home'; render(); break; }
    case 'undodraft': { var Y=S.year; S.players = S.players.filter(function(p){return p.draftYear!==Y;}); reindex(); persist(); render(); toast('Removed the '+Y+' class.'); break; }
    case 'savenow': persist(); toast('Saving…'); break;
    case 'copysave': { var txt=SER(S); try{ navigator.clipboard.writeText(txt).then(function(){toast('Backup copied — paste it into a note or file to keep it.');},function(){ fallbackCopy(txt); }); }catch(err){ fallbackCopy(txt); } break; }
    case 'dlsave': doDownload('backup'); break;
    case 'loadsave': { var el=document.getElementById('loadText'); if(el && el.value.trim()) loadSaveText(el.value.trim()); else toast('Paste a backup first, or choose a file.'); break; }
    case 'askreset': document.getElementById('resetConfirm').innerHTML = '<div class="warnbox" style="margin-top:10px">This permanently deletes the current league. <button class="btn danger" data-act="doreset">Yes, start over</button> <button class="btn" data-act="noreset">Keep my league</button></div>'; break;
    case 'noreset': document.getElementById('resetConfirm').innerHTML=''; break;
    case 'doreset': { var y2=parseInt(document.getElementById('startYear').value,10)||2027, oldKey=S&&S.key; S=null; DOC.active=null; newLeague(y2); S.name='League from '+y2; DOC.active=S; reindex(); UI.sort={}; persist(); UI.tab='draft'; location.hash='#draft'; render(); toast('League replaced. Import your '+y2+' draft.'); break; }
  }
});
function fallbackCopy(txt){
  var ta=document.getElementById('loadText'); if(ta){ ta.value=txt; ta.select(); toast('Clipboard is blocked here — the backup is selected in the box; copy it with Ctrl/Cmd+C.'); }
}
document.addEventListener('change', function(e){
  var t=e.target;
  if(t.hasAttribute('data-cmp')){ var opt = Array.prototype.filter.call(document.querySelectorAll('#cmpList option'), function(o){ return o.value===t.value; })[0]; if(opt){ UI.cmp = UI.cmp||[null,null]; UI.cmp[+t.getAttribute('data-cmp')] = +opt.getAttribute('data-id'); render(); } return; }
  if(t.hasAttribute('data-filter')){
    var g=t.getAttribute('data-filter'), k=t.getAttribute('data-key');
    if(g==='pl'){ UI.plFilter[k]=t.value; saveUI(); }
    else if(g==='st'){ UI.stFilter[k]=t.value; }
    else if(g==='std'){ UI.stdYear=t.value; }
    else if(g==='po'){ UI.poYear=t.value; }
    else if(g==='mv'){ UI.movesYear=t.value; }
    else if(g==='aw'){ UI.awYear=t.value; }
    else if(g==='sc'){ UI.scYear=t.value; UI.scWeek=null; }
    else if(g==='wky'){ UI.wkYear=t.value; UI.wkWeek=null; }
    else if(g==='df'){ UI.dFilter = UI.dFilter || {round:'all',team:'all',pos:'all'}; UI.dFilter[k]=t.value; }
    render(); return;
  }
  if(t.id==='photoFile'){ readPhotos(t.files); t.value=''; return; }
  if(t.id==='autoFill'){ S.autoFill=+t.value; scheduleSave(); return; }
  if(t.id==='gsAuto'){ if(S.gsheet){ S.gsheet.auto=t.checked; scheduleSave(); } return; }
  if(t.id==='showGen'){ readPreviewEdits(); UI.showGen=t.checked; render(); return; }
  if(t.id==='draftMode'||t.id==='fillTo'){ readDraftOptions(); return; }
  if(t.id==='loadFile'){ var f=t.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ loadSaveText(rd.result); }; rd.readAsText(f); }
});
