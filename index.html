<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Dynasty — Draft Class Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#0b1220; --panel:#121b2e; --panel2:#18233a; --line:#24314d; --text:#e8edf7; --muted:#8f9bb5;
  --accent:#f5b83d; --accent2:#3d8bf5; --good:#3ecf8e; --bad:#f2647a; --mid:#c9d3e6;
  --afc:#e5484d; --nfc:#3d8bf5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:Oswald,Inter,sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
a{color:var(--accent2)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .ball{width:30px;height:30px}
.brand h1{font-size:20px;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:11px;font-family:Inter;letter-spacing:0;font-weight:500;text-transform:none}
.yearpill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:Oswald,Inter,sans-serif;font-size:15px}
.yearpill b{color:var(--accent)}
.savestat{margin-left:auto;color:var(--muted);font-size:12px}
.savestat.ok{color:var(--good)}
.savestat.warn{color:var(--accent)}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs a{color:var(--muted);text-decoration:none;padding:9px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:18px;margin-bottom:10px;text-transform:uppercase}
.card h3{font-size:15px;margin:14px 0 8px;text-transform:uppercase;color:var(--mid)}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.blue{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#1b2a4a,#121b2e 60%);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero .trophy{font-size:44px}
.hero h2{font-size:28px;text-transform:uppercase}
.hero .score{font-family:Oswald,Inter,sans-serif;font-size:20px;color:var(--accent)}
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:Oswald,Inter,sans-serif;font-size:20px}
.tile .s{font-size:12px;color:var(--mid)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.nosort{cursor:default}
th.sorted{color:var(--accent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:rgba(255,255,255,.03)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.tablewrap table th{background:var(--panel2)}
.plink{color:var(--text);text-decoration:none;font-weight:600;cursor:pointer}
.plink:hover{color:var(--accent)}
.tlink{cursor:pointer;font-weight:600}
.tlink:hover{color:var(--accent)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--mid);margin-left:4px;vertical-align:1px}
.badge.gold{background:#3a2c08;border-color:#7a5a12;color:var(--accent)}
.badge.green{background:#0d3324;border-color:#1c6a4a;color:var(--good)}
.badge.red{background:#3a1119;border-color:#7a2533;color:var(--bad)}
.badge.blue{background:#0f2546;border-color:#24508f;color:#8fbaff}
.ovr{display:inline-block;min-width:30px;text-align:center;font-family:Oswald,Inter,sans-serif;font-weight:600;border-radius:5px;padding:0 4px}
.o90{background:#5a3e00;color:#ffd36b}.o80{background:#103c2a;color:#5ff0aa}.o70{background:#14304f;color:#9cc7ff}.o60{background:#2a2f3b;color:#c9d3e6}.o50{background:#3a1a22;color:#ff9aa9}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 9px;font:inherit}
textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input.mini{width:62px;padding:3px 6px}
select.mini{padding:3px 6px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-weight:600;font-size:12px}
.subtabs button.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.conf-h{font-family:Oswald,Inter,sans-serif;font-size:20px;margin:6px 0 10px}
.conf-h.afc{color:var(--afc)}.conf-h.nfc{color:var(--nfc)}
.div-t{margin-bottom:12px}
.div-t h4{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 0 4px}
.seed{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#1a1300;font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-right:4px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;overflow-x:auto}
.bracket .col h4{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.game{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.game div{display:flex;justify-content:space-between;padding:5px 9px;font-size:13px}
.game div.w{font-weight:700}
.game div.l{color:var(--muted)}
.game div+div{border-top:1px solid var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:1000px;width:100%;padding:20px;position:relative}
.modal .x{position:absolute;right:12px;top:10px;background:none;border:none;color:var(--muted);font-size:22px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}
.empty{padding:30px;text-align:center;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1a1300;font-weight:700;text-align:center;line-height:24px;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.list{margin:0;padding-left:18px}
.list li{margin:3px 0}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
.warnbox{border:1px solid #7a5a12;background:#2a2008;color:#ffd78a;border-radius:8px;padding:8px 12px;font-size:13px}
.cc{display:flex;gap:5px;align-items:center;justify-content:flex-end}.cc .ct{font-size:11px;color:var(--muted);min-width:30px;text-align:right}.cc.moved .ct{color:var(--accent);font-weight:700}.cc.moved .ovr{outline:1px solid var(--accent)}
.small.ok{color:var(--good)}.small.bad{color:var(--bad)}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin-top:12px}
.dropzone.over{border-color:var(--accent);background:rgba(245,184,61,.06)}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
@media (max-width:700px){.bracket{grid-template-columns:repeat(4,200px)}.brand h1{font-size:16px}}
/* ---- readability pass ---- */
:root{--muted:#a0acc4;--line:#283655}
html,body{font-size:15px;line-height:1.55}
main{padding:22px 18px 70px}
.card{padding:20px 22px;border-radius:14px}
.card h2{font-size:21px;margin-bottom:6px}
.card h3{font-size:13px;letter-spacing:.07em;margin:22px 0 10px;color:var(--accent)}
.lead{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:900px}
th,td{padding:9px 12px}
th{font-size:11.5px}
tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
tbody tr:hover{background:rgba(245,184,61,.06)}
.tablewrap td:first-child,.tablewrap th:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}
.tablewrap th:first-child{z-index:3;background:var(--panel2)}
.tablewrap tbody tr:nth-child(even) td:first-child{background:#151f34}
.badge{font-size:11px;padding:2px 7px;border-radius:5px}
.ovr{min-width:34px;font-size:14px;padding:1px 6px}
.btn{padding:9px 16px}
.filters{gap:10px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.filters select{min-width:130px}
.tile .v{font-size:22px}
.kv{font-size:14px;gap:8px 20px}
.kv span:nth-child(odd){font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.modal{max-width:1080px;padding:26px}
.modal h3{border-top:1px solid var(--line);padding-top:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.nextstep{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stepchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px}
.stepchip.done{border-color:#1c6a4a;color:var(--good)}
.stepchip.now{border-color:var(--accent);color:var(--accent)}
.lname{font-weight:700}
.yearpill .switch{margin-left:10px;font-family:Inter,sans-serif;font-size:12px;color:var(--accent2);text-decoration:none;border-left:1px solid var(--line);padding-left:10px}
.leaguerow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel2)}
.leaguerow.cur{border-color:#1c6a4a}
.leaguerow .delconfirm{flex-basis:100%}
.formgrid{display:grid;grid-template-columns:1fr 160px;gap:12px}
.formgrid label{display:flex;flex-direction:column;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.formgrid input{font-size:15px;text-transform:none;letter-spacing:0}
nav.tabs a{padding:11px 14px}
@media (max-width:700px){.formgrid{grid-template-columns:1fr}}

.aw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px 26px}
.aw-grid.wide{grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
table.aw td.aw-name{white-space:nowrap}
table.aw td.aw-team{color:var(--muted);font-size:13px;width:56px}
.aw-grid.two{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.aw-block h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:4px 0 6px}
table.aw td{vertical-align:middle;white-space:normal}
table.aw td.aw-pos{width:56px}
table.aw .aw-line{color:var(--mid);min-width:160px}
table.aw tr.aw-sub td{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:5px 10px}
.plink{font-weight:600}.tlink{font-weight:600}

.badge.arch{background:#1d2a45;border-color:#33507f;color:#b9d2ff}
.badge.lvl1{color:#ff9aa9;border-color:#7a2533}.badge.lvl2{color:#c9d3e6}.badge.lvl3{color:#9cc7ff;border-color:#24508f}.badge.lvl4{color:#5ff0aa;border-color:#1c6a4a}.badge.lvl5{color:#ffd36b;border-color:#7a5a12;background:#3a2c08}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px}
.attr-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.attr-top span{color:var(--muted)}
.attr-bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}.attr-bar i{display:block;height:100%;border-radius:4px}
.coachcard{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
.staff{display:flex;flex-direction:column}
.schemes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.schemes > div{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.yearbar{display:flex;gap:6px;flex-wrap:wrap}
.yearbar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.yearbar button.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.yearbar button:focus-visible,.plink:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
table.draftlist td{vertical-align:middle}
.trlink{color:inherit;text-decoration:none}.trlink:hover{color:var(--accent)}.trlink .small{color:var(--accent2)}
.tr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tr-side{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tr-side h4{font-size:16px;margin:0 0 10px}
.tr-list{list-style:none;margin:0;padding:0}.tr-item{padding:8px 0;border-top:1px solid var(--line)}.tr-item:first-child{border-top:0}.tr-res{margin-top:4px;font-size:14px}
.ret-list{list-style:none;padding:0}.ret-li{padding:8px 0;border-top:1px solid var(--line)}.ret-li:first-child{border-top:0}
.std-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(680px,1fr));gap:10px 28px}
.std-scroll{overflow-x:auto}
table.std{table-layout:fixed;min-width:640px}
table.std col.c-team{width:240px} table.std col.c-res{width:160px}
table.std td,table.std th{padding:8px 10px}
table.std td.std-team{overflow:hidden;text-overflow:ellipsis}
.seed.noseed{visibility:hidden}
.tcell{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.tcell .seed{flex:none;margin:0}
.res{color:var(--muted);font-size:13px}.res.lostsb{color:var(--text)}
.div-t h4{margin:14px 0 6px}

.capbar{height:8px;border-radius:4px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:6px}.capbar>div{height:100%;background:#2f855a}.capbar>div.over{background:#c0392b}.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}.capitem{border:1px solid rgba(127,127,127,.25);border-radius:8px;padding:8px 10px}
/* ===== visual refresh ===== */
:root{
  --bg:#0a101c; --panel:#111a2c; --panel2:#172238; --line:#223050; --line2:#2c3d63; --text:#eef2fa; --muted:#93a0bb; --mid:#c9d3e6;
  --accent:#f5b83d; --accent2:#4b94ff; --good:#3ecf8e; --bad:#f2647a; --red:#f2647a; --gold:#f5b83d;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
html,body{font-size:14.5px;line-height:1.5;background:radial-gradient(1200px 500px at 50% -200px,#16264a 0%,var(--bg) 60%) fixed,var(--bg)}
main{padding:22px 18px 70px}
.card{border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);border-color:var(--line)}
.card h2{font-size:19px;letter-spacing:.03em;margin-bottom:6px}
.card > h2 + .lead, .pagehead .lead{margin-top:2px}
.card h3{font-size:13px;letter-spacing:.07em;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{gap:16px}
.lead{font-size:13.5px;line-height:1.55}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.pagehead select{min-width:110px}
th,td{padding:7px 9px}
tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
tbody tr:hover{background:rgba(75,148,255,.07)}
.tablewrap{border-color:var(--line);border-radius:12px}
.btn{border-radius:9px;transition:border-color .15s,filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.tile{border-radius:12px;padding:12px 14px}
.tile .v{font-size:21px}
.hero{border-radius:16px;padding:22px 24px;background:linear-gradient(120deg,#22365f 0%,#152140 45%,#111a2c 100%);box-shadow:var(--shadow)}
.modal{border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55);padding:24px}
.modal h3{font-size:13px;letter-spacing:.07em;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);text-transform:uppercase}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* two-level navigation */
nav.tabs{display:block;padding:0 12px 0;overflow:visible}
.navgroups{display:flex;gap:4px;overflow-x:auto;padding:2px 0 0}
.navgroups a.ng{color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:10px 10px 0 0;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.navgroups a.ng:hover{color:var(--text);background:rgba(255,255,255,.03)}
.navgroups a.ng.on{color:var(--accent);background:var(--panel2);box-shadow:inset 0 3px 0 var(--accent)}
.navsub{display:flex;gap:4px;overflow-x:auto;background:var(--panel2);border-radius:0 10px 0 0;padding:6px 8px;margin-bottom:-1px}
.navsub a{color:var(--mid);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.navsub a:hover{background:rgba(255,255,255,.05);color:var(--text)}
.navsub a.on{background:var(--accent);color:#1a1300}

/* scores & box scores */
.weekbar{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 4px}
.weekbar button{min-width:36px;background:var(--panel2);border:1px solid var(--line);color:var(--mid);border-radius:8px;padding:6px 8px;font-weight:700}
.weekbar button.on{background:var(--accent);border-color:var(--accent);color:#1a1300}
.weekbar button.po{padding:6px 12px}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gamechip{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 0;color:var(--text);transition:border-color .15s,transform .1s}
.gamechip:hover{border-color:var(--accent2);transform:translateY(-1px)}
.gc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;color:var(--muted)}
.gc-row.w{color:var(--text);font-weight:700}
.gc-pts{font-family:Oswald,Inter,sans-serif;font-size:18px;font-variant-numeric:tabular-nums}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.scoreboard{display:flex;align-items:center;gap:14px;margin:10px 0 4px;flex-wrap:wrap}
.sb-team{flex:1;min-width:220px;display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;opacity:.75}
.sb-team.win{opacity:1;border-color:var(--line2)}
.sb-name{font-size:17px;font-weight:700}
.sb-pts{font-family:Oswald,Inter,sans-serif;font-size:38px;line-height:1}
.sb-at{color:var(--muted);font-weight:700}
.bs-block{margin-bottom:12px}
.bs-h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0}
table.bs td,table.bs th{padding:4px 6px;font-size:12.5px}
.gamelog{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.gamelog .gl{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--text);text-align:left;font-size:13px}
.gamelog .gl:hover{border-color:var(--accent2)}

/* news */
.newslist{list-style:none;padding:0;margin:0}
.news-li{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.news-li:last-child{border-bottom:none}
.news-li .ni{flex:none;width:22px;text-align:center}
.newsyear{margin-top:6px}

/* records & HOF */
.recbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rb-h{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.reclist{margin:0;padding:0;list-style:none;counter-reset:rk}
.reclist li{display:flex;align-items:baseline;gap:8px;padding:4px 6px;border-radius:6px;counter-increment:rk}
.reclist li:before{content:counter(rk);color:var(--muted);min-width:18px;text-align:right;font-size:12px}
.reclist li > span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reclist li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.reclist li.top{background:rgba(245,184,61,.1)}
.reclist li.top:before,.reclist li.top b{color:var(--accent)}
.hofgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hofcard{background:linear-gradient(160deg,#2a2210,#172238 60%);border:1px solid #5c4714;border-radius:12px;padding:12px 14px}
.hofbadge{font-size:22px}

/* rivalries, compare, coaches */
.rivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.rival{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.rv-teams{font-weight:700}
.cmp-pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 16px}
.cmp-pick input{width:100%}
table.cmp{max-width:820px;margin:0 auto}
table.cmp td{width:40%}
table.cmp th.mid{text-align:center;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;font-size:12.5px;cursor:default}
table.cmp td.win{color:var(--good);font-weight:700}
.clink{cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.35);text-underline-offset:3px}
.clink:hover{color:var(--accent)}
.capbar>div{background:var(--good)}.capbar>div.over{background:var(--bad)}
.capitem{border-color:var(--line);background:var(--panel2)}
@media (max-width:700px){ .cmp-pick{grid-template-columns:1fr} .navgroups a.ng{padding:8px 10px} main{padding:14px 10px 60px} .card{padding:14px} }
/* player profile */
.profile{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.profile p{margin:4px 0 0;line-height:1.6;color:var(--mid)}
.prof-meas{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.prof-meas b{color:var(--text)}
.prof-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-top:12px}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.trait{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(75,148,255,.12);border:1px solid rgba(75,148,255,.35);color:#cfe0ff;cursor:help}
/* live season & weekly recap */
.livecard{border-color:#2f5a3f;background:linear-gradient(135deg,#123022 0%,var(--panel) 55%);margin-bottom:16px}
.weekprog{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 6px;max-width:420px}
.weekprog>div{height:100%;background:var(--good)}
.recap-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.rc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rc.pow{border-color:#5c4714}
.rc-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.linkbtn{align-self:flex-start;background:none;border:none;color:var(--accent2);padding:0;margin-top:2px;font-size:12.5px;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.divgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.divbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
table.mini td{padding:3px 4px;font-size:13px}
table.mini tr.lead1 td{font-weight:700}
/* draft recap */
.tgrades{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.tg{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.gr{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:30px;border-radius:8px;font-family:Oswald,Inter,sans-serif;font-size:17px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line2)}
.gr.green{background:rgba(62,207,142,.15);border-color:rgba(62,207,142,.5);color:var(--good)}
.gr.blue{background:rgba(75,148,255,.15);border-color:rgba(75,148,255,.5);color:#9cc2ff}
.gr.red{background:rgba(242,100,122,.15);border-color:rgba(242,100,122,.5);color:var(--bad)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px}
.pickcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pickcard p{color:var(--mid);line-height:1.55}
.pk{display:inline-block;min-width:34px;font-family:Oswald,Inter,sans-serif;color:var(--accent);font-size:15px}
@media (max-width:700px){ .picks{grid-template-columns:1fr} }
.gr.sm{min-width:30px;height:24px;font-size:14px;border-radius:6px}
.viewtoggle{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.viewtoggle button{flex:1;min-width:200px;padding:12px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--mid);font-weight:700;font-size:14.5px;cursor:pointer}
.viewtoggle button.on{background:var(--accent);border-color:var(--accent);color:#1a1300}
.hs{display:inline-flex;flex:none;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2b3a5c,#141d31);border:1px solid var(--line2)}
.hs svg{display:block;margin-top:auto}
.pcell{display:inline-flex;align-items:center;gap:8px}
.profile.withbody{display:flex;gap:18px;align-items:flex-start}
.bodyfig{flex:none;padding:8px 8px 4px;border-radius:12px;background:linear-gradient(180deg,#1c2a47 0%,#152036 70%,#1d3b28 70%,#16301f 100%)}
.proftext{flex:1;min-width:0}
.cmpfaces{display:flex;justify-content:center;gap:28px;margin:4px 0 14px}
.cmpfaces>div:not(.muted){padding:8px;border-radius:12px;background:linear-gradient(180deg,#1c2a47 0%,#152036 70%,#1d3b28 70%,#16301f 100%)}
@media (max-width:700px){ .profile.withbody{flex-direction:column;align-items:center} }
.lineup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.depthwrap{overflow-x:auto}
.fields{display:flex;flex-direction:column;gap:10px}
.field{position:relative;height:300px;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(180deg,#2f6b3a 0,#2f6b3a 30px,#2a6234 30px,#2a6234 60px);border:2px solid #e5e7eb33;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.field .yl{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.18)}
.field .los{position:absolute;left:0;right:0;height:3px;background:#60a5fa;opacity:.8}
.field.off .los{top:19%}.field.def .los{top:87%}
.flabel{position:absolute;left:10px;top:6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;opacity:.85;z-index:2}
.field.def .flabel{top:auto;bottom:6px}
.fchip{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;z-index:1;width:60px}
.fchip:hover{z-index:3}.fchip:hover .hs{outline:2px solid var(--accent)}
.fchip .fname{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.fchip .frow{display:flex;gap:3px;align-items:center;font-size:10px}
.fchip .fpos{font-size:10px;font-weight:700;color:#e5e7eb;background:rgba(0,0,0,.45);padding:0 4px;border-radius:4px}
.fchip .ovr,.fchip .badge{font-size:10px;padding:0 4px;min-width:0}
.fchip.empty{opacity:.6}
.stline{font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
table.depth{table-layout:fixed;width:100%}table.depth td,table.depth th{padding:4px 5px;font-size:12px;vertical-align:top;overflow:hidden;text-overflow:ellipsis}table.depth th:first-child{width:58px}table.depth .dname{display:inline-block;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
table.depth td.st{background:rgba(245,184,61,.06)}
table.depth .dpos{font-weight:700;white-space:nowrap}
table.depth .dname{white-space:nowrap}table.depth .dpos .small{font-size:10px}
@media (max-width:900px){ .lineup{grid-template-columns:1fr} .fchip{width:58px} .fchip .hs{width:30px!important;height:30px!important} }
tr.champrow td{background:rgba(245,184,61,.1)}
.hofcard.plain{background:var(--panel2);border-color:var(--line)}
</style>

        log:[Y+': Veteran on '+teamById(tid).abbr+' at the start of the league (age '+age+')'], _vet:{rd:rd}, retired:false, contractEnd:Y+ri(0,4), injuredYears:0

// Drafted players need time to become elite: 90+ after 4 seasons normally, 3 for Stars, 2 for X-Factors.

// After each offseason: keep roughly 7–10 players rated 90+ at every position (a different target each year).
var SPEC_CAP = 93;

function eliteTarget(pos){ if(pos==='OT') return ri(5,7); if(pos==='OG') return ri(4,6); if(pos==='C') return ri(3,5);
  var extra = Math.max(0, (SLOTS[pos]||1)-1); var t = ri(7,10); for(var i=0;i<extra;i++) t += ri(1,2); return t; }
function superCap(pos){ return (pos==='K'||pos==='P') ? 0 : ri(1,3) + Math.floor(Math.max(0,(SLOTS[pos]||1)-1)/2); }

function calibrateElite(season){

    var spec = (pos==='K'||pos==='P');
    var act = S.players.filter(function(p){ return !p.retired && p.pos===pos; });
    if(spec) act.forEach(function(p){ if(p.ovr>SPEC_CAP){ setOvr(p, SPEC_CAP-ri(0,2)); p.pot=Math.min(p.pot,SPEC_CAP); } });
    var T = eliteTarget(pos); season.eliteTargets[pos]=T;
    var elite = act.filter(function(p){ return p.ovr>=90; });
    function setOvr(p, v, note){

      p.ovr = v; if(last && last.y===Y && last.s!=='Draft' && last.s!=='Start') last.ovr = v;
      season.changes.forEach(function(c){ if(c.id===p.id) c.to = v; });
      if(note) p.log.push(Y+': '+note);
    }
    // superstars stay rare: only 1–3 players rated 95+ per position (oldest come back to the pack first)
    var supers = act.filter(function(p){ return p.ovr>=95; }).sort(function(a,b){ return (b.age-a.age) || (a.ovr-b.ovr); });
    var maxSup = superCap(pos);
    supers.slice(0, Math.max(0, supers.length-maxSup)).forEach(function(p){ setOvr(p, ri(91,94)); p.pot = Math.min(p.pot, p.ovr+1); });
    // changing of the guard: rising young players who produced take the spot of aging 90s
    var olds = elite.filter(function(p){ return p.age>=(spec?33:29); }).sort(function(a,b){ return (b.age-a.age) || (a.ovr-b.ovr); });
    var risers = act.filter(function(p){ return p.ovr<90 && (!p.ceil || p.ceil >= 90) && p.ovr>=(spec?84:85) && p.age<=27 && can90(p, Y) && p.ovr>=prevOvr(p) && !((season.perf||{})[p.id] < 0); })
      .sort(function(a,b){ var sp = season.perf||{}; return (b.ovr + (sp[b.id]||0)) - (a.ovr + (sp[a.id]||0)); });
    var swaps = Math.min(olds.length, risers.length, ri(3,5));

      cands.sort(function(a,b){ return (b.ovr + (30-b.age)*1.6 + (b.dev==='X-Factor'?3:b.dev==='Star'?1.5:0)) - (a.ovr + (30-a.age)*0.9 + (a.dev==='X-Factor'?3:a.dev==='Star'?1.5:0)); });
      if(cands.length < T-elite.length){ cands = cands.concat(act.filter(function(p){ return p.ovr<90 && can90(p, Y) && prevOvr(p)>=(spec?78:82) && p.ovr>=(spec?80:82) && p.age<=(spec?37:33) && cands.indexOf(p)<0; }).sort(function(a,b){ return b.ovr-a.ovr; })); }
      if(cands.length < T-elite.length){ cands = cands.concat(act.filter(function(p){ return p.ovr<90 && can90(p, Y) && prevOvr(p)>=(spec?78:82) && p.ovr>=(spec?78:81) && p.age<=(spec?38:35) && cands.indexOf(p)<0; }).sort(function(a,b){ return b.ovr-a.ovr; })); }
      cands.slice(0, T-elite.length).forEach(function(p){

// Each draft class gets 1–5 rookies rated 80+ (a different number every year), led by its best college prospects.

/* ---------- full season ---------- */

  season.moves.push({id:p.id, type:'Trade', txt:p.name+' — '+txt, tradeId:trId});
}
function pickTxt(k, holder){ return pickLabel(k.y, k.rd, k.orig, holder); }
// Offseason trades — like the NFL, most deals are built around draft picks.
function doTrades(season){
  var Y = season.year, n = ri(6,10), done = 0, MR = maxDraftRound();
  var rank = season.standings.slice().sort(function(a,b){ return (b.w-a.w) || ((b.pf-b.pa)-(a.pf-a.pa)); }).map(function(r){return r.id;});
  var contenders = rank.slice(0,14), sellers = rank.slice(14);
  function ownPick(team, y, rd){ var o = findPick(team, y, rd); return o==null ? null : {y:y, rd:rd, orig:o}; }
  for(var t=0; t<n*5 && done<n; t++){
    var sid = pick(sellers);
    var pool = S.players.filter(function(p){ return !p.retired && p.teamId===sid && p.ovr>=72 && p.age>=24 && p._tradedY!==Y && p.pos!=='K' && p.pos!=='P'; });
    if(!pool.length) continue;
    pool.sort(function(a,b){ return b.ovr-a.ovr; });
    var p = pool[Math.min(pool.length-1, ri(0,3))];
    var needy = contenders.filter(function(cid){ var at = S.players.filter(function(q){ return !q.retired && q.teamId===cid && q.pos===p.pos; }).map(function(q){return q.ovr;}).sort(function(a,b){return b-a;}); return at.length < SLOTS[p.pos] || at[SLOTS[p.pos]-1] < p.ovr - 2; });
    if(!needy.length) continue;
    var bid = pick(needy);
    // price in picks: stars cost firsts (sometimes two), good starters a 2nd, others a mid-round pick
    var want = [];
    var oldDiscount = p.age>=30 ? 1 : 0;
    if(p.ovr>=92 && !oldDiscount){ want.push([Y+1,1]); want.push([Y+2,1]); }
    else if(p.ovr>=86){ want.push([rnd()<.5?Y+1:Y+2, 1]); if(rnd()<.5) want.push([Y+2, ri(2,Math.min(3,MR))]); }
    else if(p.ovr>=80){ want.push([Y+1,2]); if(rnd()<.4) want.push([Y+2, Math.min(MR, ri(2,4))]); }
    else want.push([Y+1, Math.min(MR, ri(3,5))]);
    if(oldDiscount) want = want.map(function(w){ return [w[0], Math.min(MR, w[1]+1)]; });
    var picks = []; want.forEach(function(w){ var k = ownPick(bid, w[0], w[1]); if(k) picks.push(k); });
    var young = S.players.filter(function(q){ return !q.retired && q.teamId===bid && q.age<=25 && q.ovr>=62 && q.ovr<p.ovr && q._tradedY!==Y && q.pos!=='K' && q.pos!=='P'; });
    var back = (young.length && rnd()<.22) ? pick(young) : null;
    if(back && picks.length>1) picks.pop();
    if(!picks.length && !back) continue;
    // sometimes the seller sends a late pick back to balance the deal
    var sweet = (rnd()<.2) ? ownPick(sid, Y+1, MR) : null;
    var sT = teamById(sid), bT = teamById(bid);
    picks.forEach(function(k){ movePick(k.y, k.rd, k.orig, sid); });
    if(sweet) movePick(sweet.y, sweet.rd, sweet.orig, bid);
    p.teamId = bid; p._tradedY = Y;
    if(back){ back.teamId = sid; back._tradedY = Y; }
    var tr = recordTrade(season, sid, bid, {players: back?[back.id]:[], picks:picks}, {players:[p.id], picks: sweet?[sweet]:[]}, 'player');
    var got = (back? back.name+' ('+back.pos+')' : '') + (back && picks.length? ' and ' : '') + picks.map(function(k){ return pickTxt(k, bid); }).join(' and ');
    tradeTx(p, Y, 'Traded from '+sT.abbr+' to '+bT.abbr+' for '+got+(sweet? ' (with '+pickTxt(sweet, sid)+' going to '+bT.abbr+')':''), season, tr.id);
    if(back) tradeTx(back, Y, 'Traded from '+bT.abbr+' to '+sT.abbr+' in the deal for '+p.name+' ('+p.pos+')', season, tr.id);
    done++;
  }
}
// Pick-only trades after the draft order is set: teams trade up and down the board, and deal future picks.
function pickTrades(season){
  var Y = season.year, D = Y+1, n = ri(2,5), MR = maxDraftRound();
  S.trades = S.trades || [];
  for(var t=0, done=0; t<n*6 && done<n; t++){
    var i = ri(4, 24), j = ri(0, Math.max(0, i-3));      // team at slot i moves up to slot j
    var upOrig = S.draftOrder[j], downOrig = S.draftOrder[i];
    var seller = pickOwner(D,1,upOrig), buyer = pickOwner(D,1,downOrig);
    if(seller===buyer) continue;
    var gap = i - j, give = [{y:D, rd:1, orig:downOrig}];
    if(gap>=8 || rnd()<.35){ var f = findPick(buyer, D+1, 1); if(f!=null && gap>=10) give.push({y:D+1, rd:1, orig:f}); }
    if(give.length===1){ var k2 = findPick(buyer, D, 2); if(k2!=null) give.push({y:D, rd:2, orig:k2}); else continue; }
    if(gap>=6){ var k3 = findPick(buyer, D, Math.min(MR,3)); if(k3!=null && give.length<3) give.push({y:D, rd:Math.min(MR,3), orig:k3}); }
    var getPick = {y:D, rd:1, orig:upOrig};
    give.forEach(function(k){ movePick(k.y, k.rd, k.orig, seller); });
    movePick(getPick.y, getPick.rd, getPick.orig, buyer);
    var bT = teamById(buyer), sT = teamById(seller);
    var tr = recordTrade(season, seller, buyer, {players:[], picks:give}, {players:[], picks:[getPick]}, 'pick',
      bT.abbr+' traded up from #'+(i+1)+' to #'+(j+1));
    season.moves.push({id:null, type:'Trade', tradeId:tr.id, txt:bT.abbr+' traded up from #'+(i+1)+' to #'+(j+1)+' in the '+D+' draft — sent '+give.map(function(k){ return pickTxt(k, buyer); }).join(', ')+' to '+sT.abbr});
    done++;
  }
  // a few future-pick swaps (a later pick now for a better pick next year)
  for(var u=0; u<ri(1,3); u++){
    var a = ri(0,31), b = ri(0,31); if(a===b) continue;
    var rdA = Math.min(MR, ri(2,3)), pa = findPick(a, D, rdA), pb = findPick(b, D+1, rdA-1);
    if(pa==null || pb==null) continue;
    var gA = {y:D, rd:rdA, orig:pa}, gB = {y:D+1, rd:rdA-1, orig:pb};
    movePick(gA.y,gA.rd,gA.orig,b); movePick(gB.y,gB.rd,gB.orig,a);
    var tr2 = recordTrade(season, a, b, {players:[], picks:[gB]}, {players:[], picks:[gA]}, 'pick', 'Future pick swap');
    season.moves.push({id:null, type:'Trade', tradeId:tr2.id, txt:teamById(b).abbr+' sent '+pickTxt(gB,b)+' to '+teamById(a).abbr+' for '+pickTxt(gA,a)});
  }
}

}

// Fantasy scoring — PPR: 1 per catch, no penalty for drops. Passing 1 per 25 yds, 4 per TD, -2 per INT thrown.
// Rushing/receiving 1 per 10 yds, 6 per TD; -2 per fumble. Kickers 3 per FG, 1 per XP. Defenders (IDP): 1 per tackle, 2 per sack, 3 per INT, 1 per pass defended, 2 per forced fumble.
function fpts(s){
  if(!s || !s.gp) return 0;
  var f = 0;
  if(s.att!=null) f += (s.pyds||0)/25 + (s.ptd||0)*4 - (s.int||0)*2;
  f += (s.ryds||0)/10 + (s.rtd||0)*6;
  f += (s.rec||0) + (s.recyds||0)/10 + (s.rectd||0)*6;
  f -= (s.fum||0)*2;
  if(s.fgm!=null) f += s.fgm*3 + (s.xpm||0);
  if(s.tkl!=null) f += s.tkl + (s.sck||0)*2 + (s.int||0)*3 + (s.pd||0) + (s.ff||0)*2;
  return Math.round(f*10)/10;
}
function fppg(s){ return s && s.gp ? Math.round(fpts(s)/s.gp*10)/10 : 0; }

// Retirements worth showing: the best careers first (peak rating, honors, years played)
function notableRetired(ss, limit){
  var all = ss.retired.map(P).filter(Boolean);
  function honors(p){ var n=0; p.awards.forEach(function(a){ n += /of the Year/.test(a)?5 : /All-Pro/.test(a)?3 : /Pro Bowl/.test(a)?1 : /Champion/.test(a)?1 : 0; }); return n; }
  var list = all.filter(function(p){ return peak(p) >= 82 || honors(p) >= 2 || !p.gen; })
    .sort(function(a,b){ return (peak(b)+honors(b)*1.5) - (peak(a)+honors(a)*1.5); });
  return {list: list.slice(0, limit||12), shown: Math.min(list.length, limit||12), total: all.length};
}
function retiredLi(p){
  var ap=0,pb=0,maj=0,sb=0; p.awards.forEach(function(a){ if(/All-Pro/.test(a))ap++; else if(/Pro Bowl/.test(a))pb++; else if(/of the Year/.test(a))maj++; else if(/Champion/.test(a))sb++; });
  return '<li class="ret-li"><div>'+pLink(p, teamsOf(p).slice(-1)[0])+' <span class="badge">'+p.pos+'</span> '+ovrBadge(peak(p))+' <span class="small muted">peak</span></div>'+

    ((maj||ap||pb||sb)?'<div style="margin-top:3px">'+(maj?'<span class="badge gold">'+maj+'× award</span>':'')+(ap?'<span class="badge gold">'+ap+'× All-Pro</span>':'')+(pb?'<span class="badge green">'+pb+'× Pro Bowl</span>':'')+(sb?'<span class="badge blue">'+sb+'× 🏆</span>':'')+'</div>':'')+'</li>';
}
function retiredBlock(ss, limit){
  var r = notableRetired(ss, limit);

    '<div class="small muted" style="margin-top:8px">'+(r.total>r.shown? 'Showing the '+r.shown+' best careers of '+r.total+' players who retired.' : r.total+' player'+(r.total>1?'s':'')+' retired.')+'</div>';

function mimeFor(n){ return /\.csv$/.test(n)?'text/csv':/\.html$/.test(n)?'text/html':/\.json$/.test(n)?'application/json':'text/plain'; }
function downloadFile(name, data){
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(dl){
      if(!dl){ toast('Downloads aren\'t available in this view.'); return; }
      return dl.save({filename:name, data:data}).then(function(){ toast('Saved '+esc(name)); }, function(e){ var c=e&&e.code; toast(c==='declined'?'Download cancelled.':'Could not download ('+esc(c||'error')+').'); });
    }).catch(function(){ toast('Downloads aren\'t available in this view.'); });
    return;
  }
  try{
    var url=URL.createObjectURL(new Blob([data],{type:mimeFor(name)})), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Downloaded '+esc(name));
  }catch(e){ toast('Download failed.'); }
}
function doDownload(kind, y){

    case 'report': return downloadFile(tag+'-'+y+'-season-report.html', seasonReportHTML(y));

    case 'standings': return downloadFile(tag+'-'+y+'-standings.csv', standingsCSV(y));
    case 'draft': return downloadFile(tag+'-'+y+'-draft.csv', draftCSV(y));
    case 'allstats': return downloadFile(tag+'-all-player-seasons.csv', playerSeasonCSV(S.seasons.map(function(s){return s.year;})));

    case 'app': return downloadFile('gridiron-dynasty.html', buildDoc());

  years.forEach(function(y){ var ss=seasonOf(y); if(!ss) return;
    ss.standings.slice().sort(function(a,b){var ta=teamById(a.id),tb=teamById(b.id);return (ta.conf+ta.div).localeCompare(tb.conf+tb.div)||((b.w+b.t*.5)-(a.w+a.t*.5));}).forEach(function(r){ var t=teamById(r.id); rows.push([y,t.city+' '+t.name,t.conf,t.div,r.w,r.l,r.t,r.pf,r.pa,r.seed||'',finishText(r.finish),r.off,r.def]); });

var GS_SERVER='Google Sheets', GS={mcp:undefined, schemas:{}, busy:false, status:''};
try{ if(window.claude && typeof window.claude.use==='function'){ window.claude.use('mcp').then(function(m){ GS.mcp=m||null; if(UI.tab==='reports') render(); }).catch(function(){ GS.mcp=null; }); } else GS.mcp=null; }catch(e){ GS.mcp=null; }
function sheetIdFromUrl(u){ u=String(u||'').trim(); var m=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/)||u.match(/\/d\/([a-zA-Z0-9_-]{20,})/); if(m) return m[1]; if(/^[a-zA-Z0-9_-]{25,}$/.test(u)) return u; return null; }
function gsKeys(schema){ return schema && schema.properties ? Object.keys(schema.properties) : []; }
function gsFind(keys, res){ for(var i=0;i<res.length;i++){ for(var j=0;j<keys.length;j++){ if(res[i].test(keys[j])) return keys[j]; } } return null; }
function gsPropType(schema,k){ var p=schema&&schema.properties&&schema.properties[k]; return p && p.type; }
function gsId(schema, id){ var k=gsFind(gsKeys(schema),[/^spreadsheet_?id$/i,/spreadsheet.*id/i,/^file_?id$/i,/^id$/i,/spreadsheet/i])||'spreadsheetId'; var o={}; o[k]=id; return o; }
function gsArgsValues(schema, id, range, values){
  var keys=gsKeys(schema), o=gsId(schema,id);
  var vk=gsFind(keys,[/^values$/i,/values/i,/^rows$/i]), rk=gsFind(keys,[/^range$/i,/range/i]), ik=gsFind(keys,[/input_?option/i,/value_?input/i]);
  if(!vk && keys.indexOf('data')>=0){ o.data=[{range:range, values:values}]; }
  else { o[rk||'range']=range; o[vk||'values']= gsPropType(schema,vk)==='string' ? JSON.stringify(values) : values; }
  if(ik) o[ik]='RAW'; else if(!keys.length) o.valueInputOption='RAW';
  return o;
}
function gsArgsRequests(schema, id, requests){
  var keys=gsKeys(schema), o=gsId(schema,id);
  var rk=gsFind(keys,[/^requests$/i,/request/i,/^updates?$/i,/batch/i])||'requests';
  o[rk] = gsPropType(schema,rk)==='string' ? JSON.stringify(requests) : requests;
  return o;
}
function gsSchema(tool){
  if(GS.schemas[tool]) return Promise.resolve(GS.schemas[tool]);
  return GS.mcp.describeTool(GS_SERVER, tool).then(function(d){ GS.schemas[tool]=d&&d.inputSchema||null; return GS.schemas[tool]; }, function(){ return null; });
}
function gsCall(tool, build){
  return gsSchema(tool).then(function(schema){
    var had = !!schema;
    return GS.mcp.callTool(GS_SERVER, tool, build(schema||{})).catch(function(e){
      if(e && (e.code==='tool_error'||e.code==='bad_request') && !had){
        return gsSchema(tool).then(function(s2){ if(!s2) throw e; return GS.mcp.callTool(GS_SERVER, tool, build(s2)); });
      }
      throw e;
    });
  });
}
function gsFindSheets(obj, out){
  out = out || [];
  if(!obj || typeof obj!=='object') return out;
  if(Array.isArray(obj)){ obj.forEach(function(x){ gsFindSheets(x,out); }); return out; }
  var pr = obj.properties && typeof obj.properties==='object' ? obj.properties : obj;
  if(typeof pr.title==='string' && (pr.sheetId!=null || pr.sheet_id!=null || pr.gridProperties)){
    var gp = pr.gridProperties||pr.grid_properties||{};
    out.push({title:pr.title, sheetId: pr.sheetId!=null?pr.sheetId:pr.sheet_id, rows: gp.rowCount||gp.row_count||null, cols: gp.columnCount||gp.column_count||null});
  }
  Object.keys(obj).forEach(function(k){ if(obj[k] && typeof obj[k]==='object') gsFindSheets(obj[k], out); });
  return out;
}
function gsErrText(e){
  var c = e && e.code;
  if(c==='server_not_connected'||c==='server_not_found') return 'Google Sheets isn\'t connected. Add the Google Sheets connector in claude.ai Settings → Connectors, then try again.';
  if(c==='needs_reauth') return 'Your Google Sheets connection expired. Reconnect it in claude.ai Settings → Connectors.';
  if(c==='selection_required') return 'You have more than one Google Sheets connection — choose one when Claude asks, then try again.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='not_granted') return 'This page needs your permission to use Google Sheets. Click Sync again and choose Allow.';
  if(c==='blocked_by_policy') return 'Your organization blocks this Google Sheets action.';
  if(c==='server_unavailable'||c==='rate_limited') return 'Google Sheets didn\'t answer in time. Wait a moment and try again.';
  if(c==='tool_error') return 'Google Sheets refused the update: '+String(e.message||'').slice(0,240)+' — check that the link is to a sheet you can edit.';
  return 'Sync failed ('+(c||'error')+'): '+String(e&&e.message||'').slice(0,200);
}
function gsSetStatus(t, cls){ GS.status=t; GS.statusCls=cls||''; var el=document.getElementById('gsStatus'); if(el){ el.textContent=t; el.className='small '+(cls||''); } }
function gsQuote(title){ return "'"+title.replace(/'/g,"''")+"'"; }
function syncToSheets(){
  if(!GS.mcp){ return Promise.reject({code:'capability_disabled',message:'Google Sheets sync only works inside Claude.'}); }
  if(!S.gsheet || !S.gsheet.id) return Promise.reject({code:'no_sheet',message:'Paste your Google Sheet link first.'});
  if(GS.busy) return Promise.reject({code:'busy',message:'A sync is already running.'});
  GS.busy=true;
  var id=S.gsheet.id, tabs=sheetTabs(), last=S.gsheet.lastRows||{};
  gsSetStatus('Connecting to Google Sheets…');
  var existing=[];
  return gsCall('get_spreadsheet', function(s){ return gsId(s,id); }).then(function(res){
    existing = gsFindSheets(res && (res.payload!==undefined ? res.payload : res));
    var reqs=[];
    tabs.forEach(function(t){
      var need = Math.max(t.rows.length, last[t.title]||0) + 50, cols = Math.max(26, t.rows[0].length+2);
      var ex = existing.filter(function(x){return x.title===t.title;})[0];
      if(!ex) reqs.push({addSheet:{properties:{title:t.title, gridProperties:{rowCount:Math.max(1000,need), columnCount:cols, frozenRowCount:1}}}});
      else if(ex.sheetId!=null && ((ex.rows && ex.rows<need) || (ex.cols && ex.cols<cols))) reqs.push({updateSheetProperties:{properties:{sheetId:ex.sheetId, gridProperties:{rowCount:Math.max(ex.rows||0,need+500), columnCount:Math.max(ex.cols||0,cols)}}, fields:'gridProperties.rowCount,gridProperties.columnCount'}});
    });
    if(!reqs.length) return null;
    gsSetStatus('Setting up tabs…');
    return gsCall('update_spreadsheet', function(s){ return gsArgsRequests(s,id,reqs); }).catch(function(e){
      // a tab may already exist under that name — fall back to adding tabs one at a time
      if(e && e.code==='tool_error'){
        var chain=Promise.resolve();
        reqs.forEach(function(r){ chain=chain.then(function(){ return gsCall('update_spreadsheet', function(s){ return gsArgsRequests(s,id,[r]); }).catch(function(){}); }); });
        return chain;
      }
      throw e;
    });
  }).then(function(){
    var chain=Promise.resolve(), CH=1500;
    tabs.forEach(function(t, ti){
      var width = t.rows[0].length, rows = t.rows.map(function(r){ var o=r.slice(); while(o.length<width) o.push(''); return o.map(function(v){ return v==null?'':v; }); });
      var prev = last[t.title]||0; while(rows.length<prev) rows.push(new Array(width).fill(''));
      for(var start=0; start<rows.length; start+=CH){
        (function(st){
          chain = chain.then(function(){
            gsSetStatus('Writing '+t.title+' ('+(ti+1)+'/'+tabs.length+')…');
            return gsCall('update_values', function(s){ return gsArgsValues(s, id, gsQuote(t.title)+'!A'+(st+1), rows.slice(st, st+CH)); });
          });
        })(start);
      }
      chain = chain.then(function(){ last[t.title]=t.rows.length; });
    });
    return chain;
  }).then(function(){
    S.gsheet.lastRows=last; S.gsheet.lastSync=Date.now(); S.gsheet.lastSyncYear=S.year-1;
    GS.busy=false; S.gsheet.lastMsg='Synced through the '+(S.year-1)+' season · '+new Date().toLocaleString(); gsSetStatus('Synced ✓ '+new Date().toLocaleTimeString()+' — '+tabs.length+' tabs updated','ok');
  }, function(e){ GS.busy=false; var m=gsErrText(e); if(S.gsheet) S.gsheet.lastMsg='Last sync failed: '+m; gsSetStatus(m,'bad'); throw e; });
}

  'Reply with ONLY a JSON array. Each element: {"name": string, "position": string (as written, e.g. QB, WR, EDGE, OT, CB), "college": string or null, "rating": number or string or null (the player\'s overall rating or grade if shown; if several ratings appear use the overall one; keep letter grades like "A-" as strings), "pick": number or null (overall pick number if shown), "round": number or null, "team": string or null (NFL team if shown), "age": number or null}.\n\n'+

  files = Array.prototype.slice.call(files||[]).filter(function(f){ return /^image\//.test(f.type); });

      c==='rate_limited'? 'Too many requests right now — wait a minute and try again.' :
      c==='invalid_json'? 'Claude\'s answer couldn\'t be turned into a player list. Try again, or crop the photo to just the list.' :

// Splits a player's season totals into game-by-game lines that add back up to the totals.
var GLCACHE = {};

  var res = teamResults(ss, s.tid).slice().sort(function(a,b){ return a[0]-b[0]; });

function recVal(p, s, c){

}
function careerVal(p, c, uptoY){ var t = 0; Object.keys(p.stats).forEach(function(y){ if(uptoY!=null && +y>uptoY) return; t += recVal(p, p.stats[y], c); }); return Math.round(t*10)/10; }

/* ---------- Hall of Fame ---------- */
var HOF_WAIT = 5;
function honorsCount(p){
  var c = {poy:0, opoy:0, dpoy:0, ap:0, pb:0, ring:0, roy:0};
  p.awards.forEach(function(a){
    if(/ Player of the Year/.test(a) && !/Offensive|Defensive/.test(a)) c.poy++;
    else if(/Offensive Player of the Year/.test(a)) c.opoy++;
    else if(/Defensive Player of the Year/.test(a)) c.dpoy++;
    else if(/Rookie of the Year/.test(a)) c.roy++;
    else if(/All-Pro/.test(a)) c.ap++;
    else if(/Pro Bowl/.test(a)) c.pb++;
    else if(/Champion/.test(a)) c.ring++;
  });
  return c;
}
function hofScore(p){
  var c = honorsCount(p), pk = peak(p), yrs = Object.keys(p.stats).length;
  var sc = c.poy*9 + (c.opoy+c.dpoy)*5 + c.ap*4 + c.pb*1.3 + c.ring*1 + c.roy*1 + Math.max(0, pk-86)*1.6 + Math.min(yrs, 14)*.4;
  REC_CATS.forEach(function(cat){ if(cat.f) return; if(S.recHold && S.recHold[cat.k]===p.id) sc += 4; });

}
function hofVote(season){

  cls.forEach(function(x){

  if(cls.length) news('hof', 'Hall of Fame class of '+Y+': '+cls.map(function(x){ return pn(x.p)+' ('+x.p.pos+')'; }).join(', '), 8, cls.map(function(x){ return x.p.id; }));
}

/* ---------- contracts: franchise tag, dead money, holdouts, extensions ---------- */
function tagValue(pos, Y){
  var top = S.players.filter(function(p){ return !p.retired && p.pos===pos && p.teamId!=null && p.salary; }).map(function(p){ return p.salary; }).sort(function(a,b){ return b-a; }).slice(0,5);
  var avg = top.length ? top.reduce(function(a,b){return a+b;},0)/top.length : marketValue({pos:pos, ovr:90, age:27}, Y);
  return Math.round(avg*10)/10;
}
function deadCharge(p, tid, Y){
  if(!p.salary || p.contractEnd==null) return 0;
  var left = p.contractEnd - Y + 1; if(left <= 0) return 0;
  var amt = Math.round(p.salary * Math.min(.6, .2*left) * 10)/10;
  if(amt < .5) return 0;
  var t = teamById(tid); t.dead = t.dead || {}; t.dead[Y] = Math.round(((t.dead[Y]||0) + amt)*10)/10;
  t.deadList = t.deadList || []; t.deadList.push({y:Y, id:p.id, n:p.name, a:amt});
  t.deadList = t.deadList.filter(function(d){ return d.y >= Y-1; });
  return amt;
}
function deadMoney(tid, Y){ var t = teamById(tid); return (t && t.dead && t.dead[Y]) || 0; }
function contractEvents(season, TAGGED){
  var Y = season.year;
  S.players.forEach(function(p){
    if(p.retired || p.teamId==null || p.contractEnd==null) return;
    var t = teamById(p.teamId), mv = marketValue(p, Y+1);
    // rookie extensions: a good young player entering the last year of his rookie deal
    if(!p.vet && !p.extended && p.contractEnd===Y+1 && Y+1 - p.draftYear <= 4 && p.ovr>=80 && p.age<=26 && rnd()<.75){
      var room = capSpace(p.teamId, Y+1) + (p.salary||0);
      if(room >= mv){
        var yrs = p.ovr>=88 ? ri(4,5) : ri(3,4);
        var rec = mv > (S.payRec && S.payRec[p.pos] || 0);
        signContract(p, mv, Y+1+yrs); p.extended = true;
        addTx(p, Y, 'Contract', 'Signed a '+yrs+'-year extension with '+t.abbr+' ('+contractTxt(mv, yrs)+')', season);
        if(p.ovr>=86 || rec) news('ext', pn(p)+' ('+p.pos+', '+p.ovr+') signed a '+yrs+'-year, '+fmtM(mv*yrs)+' extension with the '+tn(t.id)+(rec?' — the richest '+p.pos+' contract in league history':''), rec?7:5, [p.id]);
        return;
      }
    }
    // holdouts: stars playing on cheap deals
    if(p.ovr>=88 && p.age<=30 && p.contractEnd>=Y+1 && (p.salary||0) < mv*.5 && rnd()<(hasT(p,'DV')?.55:hasT(p,'TF')?.08:.25)){
      var room2 = capSpace(p.teamId, Y+1) + (p.salary||0);
      if(room2 >= mv && rnd()<.7){
        var y2 = ri(3,5);
        signContract(p, mv, Y+1+y2); p.extended = true;
        addTx(p, Y, 'Contract', 'Held out, then got a new deal from '+t.abbr+' ('+contractTxt(mv, y2)+')', season);
        news('holdout', pn(p)+' held out of camp and got paid: '+contractTxt(mv, y2)+' from the '+tn(t.id), 6, [p.id]);
      } else {
        p.holdout = ri(1,4);
        addTx(p, Y, 'Contract', 'Holding out for a new contract — expected to miss '+p.holdout+' game'+(p.holdout>1?'s':''), season);
        news('holdout', pn(p)+' is holding out from the '+tn(t.id)+' for a new deal and could miss '+p.holdout+' game'+(p.holdout>1?'s':''), 6, [p.id]);
      }
    }
  });
}
function noteRecordContract(p, sal, how){
  S.payRec = S.payRec || {};
  var old = S.payRec[p.pos] || 0;
  if(sal > old){
    S.payRec[p.pos] = sal;
    if(old && sal >= 8) news('sign', pn(p)+' became the highest-paid '+p.pos+' in league history ('+fmtM(sal)+' a year'+(how?', '+how:'')+')', 7, [p.id]);
  }
}
function initPayRecords(){
  S.payRec = S.payRec || {};

}

/* ---------- scouting ---------- */
function scoutRow(r){

var GRADE_TBL = [[1.9,'A+'],[1.35,'A'],[.9,'A-'],[.5,'B+'],[.12,'B'],[-.25,'B-'],[-.6,'C+'],[-1,'C'],[-1.4,'C-'],[-1.8,'D'],[-99,'F']];

function gradeNum(g){ for(var i=0;i<GRADE_TBL.length;i++) if(GRADE_TBL[i][1]===g) return Math.max(-2.2, GRADE_TBL[i][0]+.2); return 0; }
function gradeClass(g){ return /A/.test(g)?'green':/B/.test(g)?'blue':/C/.test(g)?'':'red'; }
function computeDraftRecap(Y){
  var cls = S.players.filter(function(p){ return p.draftYear===Y && !p.vet && !p.dr; });
  if(!cls.length) return;
  var all = S.players.filter(function(p){ return p.draftYear===Y && !p.vet; });
  var board = all.slice().sort(function(a,b){ var am = a.scout?(a.scout[0]+a.scout[1])/2:a.ovr, bm = b.scout?(b.scout[0]+b.scout[1])/2:b.ovr; return bm-am || a.pick-b.pick; });
  cls.forEach(function(p){
    ensureIdentity(p);
    var t = teamById(p.draftTeamId), b = board.indexOf(p)+1;
    var mates = S.players.filter(function(q){ return !q.retired && q.teamId===p.draftTeamId && q.pos===p.pos && !(q.draftYear===Y && !q.vet); });
    var ahead = mates.filter(function(q){ return q.ovr >= p.ovr; }).length, slots = SLOTS[p.pos]||1;
    var bestAt = mates.reduce(function(m,q){ return Math.max(m, q.ovr); }, 0);
    var need = ahead < slots ? 2 : ahead < slots+2 ? 1 : 0;
    var fit = schemeFit(p, t).label;
    var spread = p.round===1 ? 7 : p.round===2 ? 14 : 22;
    var v = clamp((p.pick - b)/spread, -1.6, 1.6)*.65 + (need===2?.35:need===1?.05:-.35) + (fit==='Great fit'?.35:fit==='Poor fit'?-.5:0) + (bestAt<72 && need?.15:0) - .15;
    if(p.pos==='K'||p.pos==='P') v -= p.round<=2 ? 1 : .2;
    p.dr = {b:b, n:need, f:fit==='Great fit'?'G':fit==='Poor fit'?'P':fit==='OK fit'?'O':'-', g:letter(v)};
  });
  // headline
  var teamsG = draftTeamGrades(Y), best = teamsG[0], worst = teamsG[teamsG.length-1], first = all.slice().sort(function(a,b){ return a.pick-b.pick; })[0];
  NEWS_Y = Y-1;
  if(first) news('draft', 'The '+tn(first.draftTeamId)+' opened the '+Y+' draft with '+pn(first)+' ('+first.pos+', '+esc(first.college||'')+'). Best class: '+tn(best.id)+' ('+best.g+'); worst: '+tn(worst.id)+' ('+worst.g+')', 6, [first.id]);
  NEWS_Y = null;
}
function draftTeamGrades(Y){
  var by = {};
  S.players.filter(function(p){ return p.draftYear===Y && !p.vet && p.dr; }).forEach(function(p){ (by[p.draftTeamId] = by[p.draftTeamId]||[]).push(p); });
  return Object.keys(by).map(function(id){ var l = by[id], w = 0, s = 0;
    l.forEach(function(p){ var k = p.round===1?2:p.round===2?1.4:1; w += k; s += gradeNum(p.dr.g)*k; });
    var avg = s/w + Math.min(.3, (l.length-2)*.08);
    return {id:+id, picks:l.sort(function(a,b){ return a.pick-b.pick; }), v:avg, g:letter(avg)}; }).sort(function(a,b){ return b.v-a.v; });
}
function pickReport(p){
  var d = p.dr, t = teamById(p.draftTeamId), r = seeded(p.id, 31);
  var val = d.b < p.pick - 4 ? pickR(r,['Great value — ','A steal here: ','Fell right into their lap: '])+'the '+ordinal(d.b)+' player on the consensus board went '+ordinal(p.pick)+'. ' :
            d.b > p.pick + 6 ? pickR(r,['A reach — ','They went off the board: ','Higher than most had him: '])+'he was the '+ordinal(d.b)+' player on the consensus board. ' :
            'Right about where he was projected (consensus #'+d.b+'). ';
  var need = d.n===2 ? 'Fills an immediate need — he should '+(p.ovr>=72?'start from day one':'compete for a starting job')+'.' : d.n===1 ? 'Adds depth and should rotate in early.' : 'A luxury pick — the '+esc(t.abbr)+' are already set at '+p.pos+'.';

/* ---------- development trait can move up or down ---------- */
var DEV_ORDER = ['Bust','Slow','Normal','Star','X-Factor'];
function devChange(p, Y, pfv, delta, season){
  if(!p.devKnown || p.retired) return;
  var i = DEV_ORDER.indexOf(p.dev); if(i<0) return;
  var age = p.age, up = 0, down = 0;
  // breakout seasons and real growth push it up (mostly for younger players)
  if(age <= 28){
    if(pfv >= 2.5) up += .32; else if(pfv >= 1.5) up += .15;
    if(delta >= 4) up += .18;
    if(p.ovr >= 88 && i < 3) up += .2;
    if(hasT(p,'FJ') || hasT(p,'GR')) up += .06;
    if(hasT(p,'LB') && age >= 24) up += .1;
  }
  // bad years, stalled growth and age pull it down
  if(pfv <= -2.5) down += .3; else if(pfv <= -1.5) down += .12;
  if(delta <= -3) down += .15;
  if(age <= 25 && delta <= 0 && pfv < 0 && i >= 2) down += .06;
  if(age >= 31 && i >= 3) down += .22 + (age-31)*.06;
  if(age >= 33 && i === 2) down += .05;
  if(i === 4 && p.ovr < 85) down += .3;
  if(i === 3 && p.ovr < 76 && age >= 25) down += .25;
  var to = null;
  if(up > down && rnd() < (up - down*.5)*.6 && i < 4){ if(i===3 && p.ovr < 86) return; to = DEV_ORDER[i+1]; }
  else if(down > up && rnd() < (down - up*.5)*.45 && i > 0){ to = DEV_ORDER[i-1]; }
  if(!to) return;
  var from = p.dev, better = DEV_ORDER.indexOf(to) > i;
  p.dev = to;
  if(better) p.pot = Math.min(p.ceil||99, Math.max(p.pot, p.ovr) + ri(2,5)); else p.pot = Math.max(p.ovr, p.pot - ri(2,5));
  p.devHist = p.devHist || []; p.devHist.push([Y, from, to]);
  var why = better ? (pfv >= 1.5 ? 'after a big season' : 'after a jump in his game') : (age >= 31 ? 'as age catches up with him' : pfv <= -1.5 ? 'after a down year' : 'after stalling in his development');
  addTx(p, Y, 'Development', (better?'Development upgraded':'Development downgraded')+': '+from+' → '+to+' '+why, season);
  p.log.push(Y+': Development '+(better?'upgraded':'downgraded')+' from '+from+' to '+to+' '+why);
  if((better && to==='X-Factor') || (!better && from==='X-Factor' && p.ovr>=88)) news('award', pn(p)+' ('+p.pos+', '+(p.teamId!=null?teamById(p.teamId).abbr:'FA')+') '+(better?'became an X-Factor':'lost his X-Factor status')+' '+why, better?5:4, [p.id]);
}
function devHistHTML(p){
  if(!p.devHist || !p.devHist.length) return '';
  return p.devHist.map(function(d){ var up = DEV_ORDER.indexOf(d[2]) > DEV_ORDER.indexOf(d[1]); return '<span class="badge '+(up?'green':'red')+'">'+d[0]+': '+esc(d[1])+' '+(up?'▲':'▼')+' '+esc(d[2])+'<\/span>'; }).join(' ');
}

  function key(c){ return c.cid ? 'c'+c.cid : 'n'+c.name; }
  S.teams.forEach(function(t){ (t.coachHist||[]).forEach(function(c){
    var k = key(c), r = by[k] = by[k] || {name:c.name, cid:c.cid, w:0, l:0, t:0, titles:0, seasons:0, teams:[], lastY:0, stints:[]};
    r.w += c.w||0; r.l += c.l||0; r.t += c.t||0; r.titles += c.titles||0; r.seasons += Math.max(1, (c.to||0)-(c.from||0)+1);
    if(r.teams.indexOf(t.id)<0) r.teams.push(t.id); r.lastY = Math.max(r.lastY, c.to||0); r.stints.push({tid:t.id, from:c.from, to:c.to, w:c.w, l:c.l, titles:c.titles||0, why:c.why});
  }); });
  // playoff trips and conference titles come from the season-by-season log, when it exists
  Object.keys(by).forEach(function(k){
    var r = by[k], f = r.cid ? findCoach(r.cid) : null, car = f ? (f.c.car||[]) : [];
    var hc = car.filter(function(x){ return x[2]===0; });
    r.po = hc.filter(function(x){ return x[6]>=1; }).length; r.conf = hc.filter(function(x){ return x[6]>=4; }).length;
    r.active = !!(f && f.active);
    if(!hc.length){ r.po = Math.round(r.titles*1.5); r.conf = r.titles; }
  });
  // current head coaches (for the "on track" list)
  S.teams.forEach(function(t){ var c = t.coach; if(!c) return; var k = c.id ? 'c'+c.id : 'n'+c.name;
    var r = by[k] = by[k] || {name:c.name, cid:c.id, w:0, l:0, t:0, titles:0, seasons:0, teams:[], lastY:0, stints:[], po:0, conf:0};
    r.active = true; r.cur = {tid:t.id, w:c.w||0, l:c.l||0, t:c.t||0, titles:c.titles||0, from:c.hired};
    var car = (c.car||[]).filter(function(x){ return x[2]===0; });
    r.curPo = car.filter(function(x){ return x[6]>=1; }).length; r.curConf = car.filter(function(x){ return x[6]>=4; }).length;
  });
  return Object.keys(by).map(function(k){ return by[k]; });
}
function coachHofScore(r){
  var w = r.w + (r.cur?r.cur.w:0), l = r.l + (r.cur?r.cur.l:0), ti = r.titles + (r.cur?r.cur.titles:0);
  var po = r.po + (r.curPo||0), cf = r.conf + (r.curConf||0), seasons = r.seasons + (r.cur ? Math.max(0, S.year-(r.cur.from||S.year)) : 0);
  return ti*12 + cf*4 + po*1.6 + (w-l)*.18 + seasons*.3;
}
function coachHofList(){
  var Y = lastSeason() ? lastSeason().year : S.year;
  var list = coachCareers();
  var inducted = list.filter(function(r){ return !r.active && r.seasons >= 4 && r.lastY + COACH_HOF_WAIT <= Y && coachHofScore(r) >= 24; })
    .map(function(r){ r.cls = r.lastY + COACH_HOF_WAIT; return r; }).sort(function(a,b){ return b.cls-a.cls || coachHofScore(b)-coachHofScore(a); });
  var track = list.filter(function(r){ return r.active && r.cur && coachHofScore(r) >= 18; }).sort(function(a,b){ return coachHofScore(b)-coachHofScore(a); }).slice(0,6);
  var soon = list.filter(function(r){ return !r.active && r.seasons >= 4 && r.lastY + COACH_HOF_WAIT > Y && coachHofScore(r) >= 24; });
  return {inducted:inducted, track:track, soon:soon};
}
function coachHofCard(r, note){
  var w = r.w + (r.cur?r.cur.w:0), l = r.l + (r.cur?r.cur.l:0), t = r.t + (r.cur?r.cur.t:0), ti = r.titles + (r.cur?r.cur.titles:0), po = r.po + (r.curPo||0);
  var teams = r.teams.slice(); if(r.cur && teams.indexOf(r.cur.tid)<0) teams.push(r.cur.tid);
  var name = r.cid ? cLink({id:r.cid, name:r.name}) : esc(r.name);
  return '<div class="hofcard"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><b>'+name+'<\/b><div class="small muted">Head coach · '+teams.map(function(id){ return esc(teamById(id).abbr); }).join(', ')+'<\/div><\/div><div class="hofbadge">📋<\/div><\/div>'+
    '<div class="small" style="margin-top:6px"><b>'+w+'-'+l+(t?'-'+t:'')+'<\/b> ('+((w+l+t)?((w+t*.5)/(w+l+t)*100).toFixed(1):'0')+'%) · '+po+' playoff trip'+(po===1?'':'s')+(ti?' · 🏆 '+ti+' Super Bowl'+(ti>1?'s':''):'')+'<\/div>'+
    (note?'<div class="small" style="color:var(--accent);margin-top:4px">'+note+'<\/div>':'')+'<\/div>';
}
function coachHofHTML(){
  var L = coachHofList();
  var h = '<p class="lead">Head coaches become eligible '+COACH_HOF_WAIT+' years after their last season, with at least 4 seasons in charge. Voters weigh Super Bowls most, then conference titles, playoff trips and winning record.<\/p>';
  if(L.inducted.length){
    var by = {}; L.inducted.forEach(function(r){ (by[r.cls] = by[r.cls]||[]).push(r); });
    Object.keys(by).sort().reverse().forEach(function(y){ h += '<h3>Class of '+y+'<\/h3><div class="hofgrid">'+by[y].map(function(r){ return coachHofCard(r); }).join('')+'<\/div>'; });
  } else h += '<div class="empty" style="padding:14px">No coaches inducted yet.<\/div>';
  if(L.soon.length) h += '<h3>Waiting to become eligible<\/h3><div class="hofgrid">'+L.soon.map(function(r){ return coachHofCard(r, 'Eligible '+(r.lastY+COACH_HOF_WAIT)); }).join('')+'<\/div>';
  if(L.track.length) h += '<h3>Active coaches on a Hall of Fame track<\/h3><div class="hofgrid">'+L.track.map(function(r){ return coachHofCard(r, 'Currently coaching the '+esc(teamById(r.cur.tid).name)); }).join('')+'<\/div>';
  return h;
}

function fallbackCopy(txt){

    var g=t.getAttribute('data-filter'), k=t.getAttribute('data-key');

    else if(g==='st'){ UI.stFilter[k]=t.value; }

    else if(g==='po'){ UI.poYear=t.value; }
    else if(g==='mv'){ UI.movesYear=t.value; }

    else if(g==='sc'){ UI.scYear=t.value; UI.scWeek=null; }
